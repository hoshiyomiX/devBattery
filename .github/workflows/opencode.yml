name: OpenCode Agent Pro

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  # ── /oc <prompt> ── full edit & commit mode
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    if: |
      (
        contains(github.event.comment.body, '/oc ') ||
        contains(github.event.comment.body, '/opencode ')
      ) &&
      !contains(github.event.comment.body, '@plan') &&
      !contains(github.event.comment.body, '@review') &&
      !contains(github.actor, '[bot]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config --global user.name "OpenCode Agent"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      - name: Run OpenCode Build Agent
        uses: anomalyco/opencode/github@latest
        env: {}
        with:
          model: opencode/big-pickle
          agent: build
          prompt: |
            {
              "temperature": 0.05,
              "steps": 8,
              "reasoningEffort": "high",
              "textVerbosity": "low",
              "top_p": 0.90
            }
            You are a precise, context-aware coding agent that deeply understands any repository structure.

            First — quickly map the repository:
            • Folder layout and naming conventions
            • Main entry points / build scripts / config files
            • Key modules, components, services, assets, dependencies

            <thinking> (max 100 words total):
            1. Summarize the current request + essential repo context
            2. Identify directly affected files + closely related files (potential side effects)
            3. Plan the smallest safe change using exact file paths
            4. List only 1–3 most important side effects / regressions (if any exist)
            If risk appears high → stop and request clarification instead of applying
            </thinking>

            Apply changes ONLY when impact is minimal and safe.
            Output format:
            • One-sentence safety summary
            • Diffs / patches only (never full file unless very small)
            • Short final comment for branch/PR: concise reason + "Applied safely"

  # ── /oc @plan <prompt> ── planning & suggestion mode
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    if: |
      (
        contains(github.event.comment.body, '/oc @plan ') ||
        contains(github.event.comment.body, '/opencode @plan ')
      ) &&
      !contains(github.actor, '[bot]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config --global user.name "OpenCode Agent"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      - name: Run OpenCode Plan Agent
        uses: anomalyco/opencode/github@latest
        env: {}
        with:
          model: opencode/big-pickle
          agent: plan
          prompt: |
            {
              "temperature": 0.08,
              "steps": 10,
              "reasoningEffort": "medium",
              "textVerbosity": "low",
              "top_p": 0.92
            }
            You are a concise, repository-structure-aware planning agent.

            First — understand the repo shape:
            • Directory organization & naming patterns
            • Primary entry points / build / config files
            • Key dependencies & architectural style

            <thinking> (max 90 words):
            1. Goal + brief repo context
            2. Most relevant files & directories
            3. Minimal step-by-step plan (3–6 steps maximum)
            4. 1–2 primary risks / side effects
            </thinking>

            Output ONLY:
            • PLAN: numbered steps including exact file paths
            • Small, targeted code snippets when helpful
            • Brief risks & suggested mitigations
            • Final line: "Ready to apply? Use /oc <your request>"

  # ── /oc @review <prompt> ── code review mode
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    if: |
      (
        contains(github.event.comment.body, '/oc @review ') ||
        contains(github.event.comment.body, '/opencode @review ')
      ) &&
      !contains(github.actor, '[bot]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config --global user.name "OpenCode Agent"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      - name: Run OpenCode Review Agent
        uses: anomalyco/opencode/github@latest
        env: {}
        with:
          model: opencode/big-pickle
          agent: review
          prompt: |
            {
              "temperature": 0.09,
              "steps": 8,
              "reasoningEffort": "medium",
              "textVerbosity": "low",
              "top_p": 0.90
            }
            You are a focused, structure-aware code reviewer.

            First — understand context:
            • File position & role in overall repository
            • Related files / modules that interact with it
            • Typical patterns & conventions in this codebase

            <thinking> (max 80 words):
            1. Purpose & location summary
            2. 2–5 most important issues (correctness, performance, maintainability, security)
            3. Any structural or architectural concerns
            </thinking>

            Output in markdown:
            ## Strengths (1–3 points)
            ## Important Issues (priority ordered)
            ## Minor Suggestions
            ## Overall Score (1–10) + one-sentence verdict
            ## Recommendation

            Direct, objective, concise. No unnecessary words.
