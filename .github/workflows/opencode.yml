name: OpenCode Agent

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    if: |
      (contains(github.event.comment.body, '/oc') || 
       contains(github.event.comment.body, '/opencode')) &&
      !contains(github.actor, '[bot]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config --global user.name "OpenCode Agent"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      - name: Run OpenCode Agent
        uses: anomalyco/opencode/github@latest
        env: {}  # Kosong untuk free Zen models
        with:
          model: opencode/big-pickle   # atau opencode/kimi-k2.5-free kalau ingin test (sering lebih akurat di coding)
          agent: general
          prompt: |
            {
              "temperature": 0.1,
              "steps": 10,
              "reasoningEffort": "medium",
              "textVerbosity": "low"
            }
            You are a precise coding agent. Stick strictly to the provided files and user request. 
            Think step-by-step briefly in <thinking> tags (max 200 words). 
            Do NOT hallucinate non-existent code, APIs, or behaviors. 
            If uncertain, state it clearly and stop. 
            Output ONLY the necessary file changes or diffs. 
            Be concise, no unnecessary explanations outside <thinking>.
