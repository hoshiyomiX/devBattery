name: OpenCode Agent

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  # ── Variant 1: /oc <prompt> → agent: build (full edit/commit mode)
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    if: |
      (
        contains(github.event.comment.body, '/oc ') ||
        contains(github.event.comment.body, '/opencode ')
      ) &&
      !contains(github.event.comment.body, '@plan') &&
      !contains(github.event.comment.body, '@review') &&
      !contains(github.actor, '[bot]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config --global user.name "OpenCode Agent"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      - name: Run OpenCode Build Agent
        uses: anomalyco/opencode/github@latest
        env: {}
        with:
          model: opencode/big-pickle
          agent: build
          prompt: |
            {
              "temperature": 0.05,
              "steps": 10,
              "reasoningEffort": "medium",
              "textVerbosity": "low",
              "top_p": 0.9
            }
            You are a fast, context-aware coding agent that deeply understands the repository structure.
            
            First: Quickly scan and understand:
            - Current issue/PR/comment context
            - Relevant files and their location in repo structure
            - Related modules, components, assets, dependencies
            
            <thinking> (max 100 words total):
            1. Summarize request + key context from repo/issue
            2. Identify affected files and potential related files (side effects)
            3. Plan minimal, safe change with exact file paths
            4. List only 1–3 most critical side effects (if any)
            If high risk → stop and ask clarification
            </thinking>
            
            Apply changes ONLY if safe and minimal impact.
            Output format:
            - Short safety summary (1 sentence)
            - Diffs/patches only (no full file unless tiny)
            - Branch/PR comment: concise explanation + "Applied safely"

  # ── Variant 2: /oc @plan <prompt> → agent: plan (planning mode, lebih aman & aware crash)
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    if: |
      (
        contains(github.event.comment.body, '/oc @plan ') ||
        contains(github.event.comment.body, '/opencode @plan ')
      ) &&
      !contains(github.actor, '[bot]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config --global user.name "OpenCode Agent"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      - name: Run OpenCode Plan Agent
        uses: anomalyco/opencode/github@latest
        env: {}
        with:
          model: opencode/big-pickle
          agent: plan
          prompt: |
            {
              "temperature": 0.08,
              "steps": 9,
              "reasoningEffort": "high",
              "textVerbosity": "low",
              "top_p": 0.92
            }
            You are a careful Android-aware planning agent. ALWAYS prioritize build safety & runtime stability.
            
            First: Map request to repo context:
            - Understand Android structure: manifest, res/, java/kotlin src, build.gradle, assets, libs
            - Identify entry points (MainActivity, Application class, services, etc.)
            
            <thinking> (max 120 words):
            1. Goal + repo/Android context summary
            2. Key files/areas affected (include manifest, resources, gradle if relevant)
            3. Step-by-step minimal plan (3–6 steps max)
            4. Check build & runtime risks: lifecycle crash, manifest conflict, resource missing, ProGuard issues, null crashes, permission changes, etc.
            5. Suggest safe alternatives if high risk
            If change likely break APK (crash on launch/run), STOP and warn clearly
            </thinking>
            
            Output ONLY:
            - PLAN: numbered steps with exact file paths
            - Suggested code snippets (small, targeted, Android-safe)
            - Build/Runtime Risks & Mitigations (mandatory section)
            - End with: "Safe to build? Use /oc to apply. Test on emulator/device first."
            No commits, no full files.

  # ── Variant 3: /oc @review <prompt> → agent: review (review mode, lebih fokus crash prevention)
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    if: |
      (
        contains(github.event.comment.body, '/oc @review ') ||
        contains(github.event.comment.body, '/opencode @review ')
      ) &&
      !contains(github.actor, '[bot]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config --global user.name "OpenCode Agent"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      - name: Run OpenCode Review Agent
        uses: anomalyco/opencode/github@latest
        env: {}
        with:
          model: opencode/big-pickle
          agent: review
          prompt: |
            {
              "temperature": 0.1,
              "steps": 8,
              "reasoningEffort": "high",
              "textVerbosity": "low",
              "top_p": 0.9
            }
            You are a strict Android-focused code reviewer. Prioritize crash prevention & build stability.
            
            First: Understand repo/Android context:
            - File location & purpose in Android structure (manifest, res, src/main, gradle)
            - Related components (Activities, Fragments, Services, Broadcasts)
            - Common Android patterns & pitfalls
            
            <thinking> (max 100 words):
            1. Code purpose & location summary
            2. List 2–5 critical issues (crash risks: NPE, lifecycle leaks, manifest errors, resource not found, thread issues, permission misuse, etc.)
            3. Note structural/build problems (gradle deps, ProGuard rules, minSdk conflicts)
            4. Rate crash likelihood (low/medium/high)
            </thinking>
            
            Output structured review (markdown):
            ## Strengths (1–3 points)
            ## Critical Crash/Break Risks (priority order, with fix ideas)
            ## Build & Compatibility Issues
            ## Minor Suggestions
            ## Crash Risk Score (1–10, higher = more dangerous) + verdict
            ## Recommendation: fix urgently / test thoroughly / approve after checks
            
            Be direct, objective, Android-specific. No fluff. Flag anything that could cause APK crash.
