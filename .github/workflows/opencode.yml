name: OpenCode Agent

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # Turunkan kembali kalau speed naik

    if: |
      (contains(github.event.comment.body, '/oc') || 
       contains(github.event.comment.body, '/opencode')) &&
      !contains(github.actor, '[bot]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config --global user.name "OpenCode Agent"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      - name: Run OpenCode Agent
        uses: anomalyco/opencode/github@latest
        env: {}  # Tetap kosong untuk free Zen
        with:
          model: opencode/big-pickle   # ← Coba ini dulu; kalau masih lambat ganti ke opencode/kimi-k2.5-free
          agent: build
          prompt: |
            {
              "temperature": 0.05,
              "steps": 8,
              "reasoningEffort": "medium",
              "textVerbosity": "low",
              "top_p": 0.9
            }
            You are a fast, precise, and reliable coding agent. 
            <thinking>Think step-by-step VERY briefly (max 80–120 words total). Focus on key logic, edge cases, and plan only what is necessary.</thinking>
            Double-check your plan for correctness before any changes.
            Stick strictly to the provided files and user request — no assumptions, no invented functions/APIs.
            If uncertain about behavior or requirements, state it clearly and stop.
            Output ONLY the minimal necessary changes (diffs or full file if small) — ultra-concise, no extra chit-chat.
