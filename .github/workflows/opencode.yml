name: OpenCode Agent

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: |
      (contains(github.event.comment.body, '/oc') || 
       contains(github.event.comment.body, '/opencode')) &&
      !contains(github.actor, '[bot]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # downgrade ke v4 untuk stabilitas lebih baik di 2026
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config --global user.name "OpenCode Agent"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      - name: Run OpenCode Agent
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY:   ${{ secrets.OPENCODE_API_KEY }}
          ZAI_API_KEY:        ${{ secrets.ZAI_API_KEY }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}  # atau ${{ github.token }}
          # Tambahkan API key provider lain jika model butuh, misal:
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          model: opencode/glm-4.7-free  # atau model yang kamu pakai, misal opencode/gpt-4o-free jika support
          # model: opencode/glm-4.7-free   # jika ini model custom/hosted, pastikan API key sesuai

          use_github_token: true
          agent: general   # atau 'build', 'plan', dll sesuai kebutuhan

          # Tambahan: override prompt untuk inject konfigurasi temperature, steps, reasoningEffort
          # Ini akan override default agent behavior untuk invocation ini
          prompt: |
            {
              "temperature": 0.2,
              "steps": 12,
              "reasoningEffort": "high",
              "textVerbosity": "medium",   
              "top_p": 0.95    
            }
            Process the user's request following standard OpenCode agent flow, 
            but apply the above parameters strictly for this session.
            Be precise, use high reasoning effort, limit to max 12 steps/iterations.

          # Alternatif jika ingin lebih clean: buat custom agent di opencode.json repo,
          # lalu ganti agent: nama-agent-kamu
