name: opencode

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    runs-on: ubuntu-latest
    if: contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}          # API key Z.ai
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}         # <-- FIX KUNCI: Set GITHUB_TOKEN dari secrets
          # Kalau Z.ai GLM pakai endpoint Anthropic-compatible, tambah ini juga:
          # ANTHROPIC_API_KEY: ${{ secrets.ZAI_API_KEY }}
        with:
          model: opencode/glm-4.7                                    # atau zhipuai/glm-4.7 / zai/glm-4.7 kalau prefix dibutuhkan
          use_github_token: true                            # Aktifkan fallback ke runner token
          agent: default                                    # optional
