name: OpenCode Agent

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # Biar aman kalau free model lagi queue

    if: |
      (contains(github.event.comment.body, '/oc') || 
       contains(github.event.comment.body, '/opencode')) &&
      !contains(github.actor, '[bot]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config --global user.name "OpenCode Agent"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      - name: Run OpenCode Agent
        uses: anomalyco/opencode/github@latest
        env: {}   # Kosong untuk free models (no key needed)
        with:
          model: big-pickle   # ← Best free choice sekarang
          # Alternatif: minimax-m2.1-free atau kimi-k2.5-free
          agent: general

          prompt: |
            {
              "temperature": 0.2,
              "steps": 12,
              "reasoningEffort": "high"
            }
            Process the request with high precision and limited iterations.
