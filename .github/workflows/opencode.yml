name: OpenCode Agent

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # Naikkan sedikit biar aman kalau free tier lambat

    if: |
      (contains(github.event.comment.body, '/oc') || 
       contains(github.event.comment.body, '/opencode')) &&
      !contains(github.actor, '[bot]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config --global user.name "OpenCode Agent"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      - name: Run OpenCode Agent
        uses: anomalyco/opencode/github@latest
        env: {}  # Kosongkan env sepenuhnya untuk free model (atau hapus block env ini)
        with:
          model: opencode/glm-4.7-free  # ← Gunakan ini dulu (varian free resmi GLM-4.7)
          # Kalau tidak jalan, coba alternatif: glm-4.7-free (tanpa opencode/)
          # Tidak ada "opencode/glm-4.7-flash-free" di docs resmi — mungkin typo atau custom; GLM-4.7-Flash free biasanya via Z.ai bukan OpenCode direct
          agent: general

          prompt: |
            {
              "temperature": 0.2,
              "steps": 12,
              "reasoningEffort": "high"
            }
            Process the request with high precision and limited iterations.
