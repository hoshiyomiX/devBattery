name: OpenCode Agent

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  # ── /oc <prompt> ── build (edit & commit)
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    if: |
      (
        contains(github.event.comment.body, '/oc ') ||
        contains(github.event.comment.body, '/opencode ')
      ) &&
      !contains(github.event.comment.body, '@plan') &&
      !contains(github.event.comment.body, '@review') &&
      !contains(github.actor, '[bot]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config --global user.name "OpenCode Agent"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      - name: Run OpenCode Build Agent
        uses: anomalyco/opencode/github@latest
        env: {}
        with:
          model: opencode/big-pickle
          agent: build
          prompt: |
            {
              "temperature": 0.05,
              "steps": 14,
              "reasoningEffort": "high",
              "textVerbosity": "low",
              "top_p": 0.90
            }
            CRITICAL: This is a NEW independent request.
            IGNORE all previous conversation history unless explicitly referenced in the LATEST comment.
            ONLY follow instructions in the most recent user message containing /oc.

            You are a deep-thinking, context-aware coding agent that fully understands the repository.

            Step 0 — Context mapping (mandatory):
            • Current repo structure: folders, key files, entry points, config, dependencies
            • Latest issue/PR/comment context
            • Files directly & indirectly related to the request

            <thinking> (max 180 words total, structured):
            1. Summarize latest request + relevant repo context
            2. Identify all affected files and potential cross-file dependencies/side effects
            3. Deep reasoning: why this change is needed, what could break, alternatives considered
            4. Final plan: minimal, safest change with exact paths
            5. Risk assessment: rate impact (low/medium/high) and mitigation
            If risk ≥ medium → pause & ask clarification
            </thinking>

            Apply changes ONLY if risk low and reasoning solid.
            Output:
            • 1-sentence safety & reasoning summary
            • Diffs/patches only
            • Short PR/branch comment: reason + "Applied safely after deep review"

  # ── /oc @plan <prompt> ── planning mode
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    if: |
      (
        contains(github.event.comment.body, '/oc @plan ') ||
        contains(github.event.comment.body, '/opencode @plan ')
      ) &&
      !contains(github.actor, '[bot]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config --global user.name "OpenCode Agent"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      - name: Run OpenCode Plan Agent
        uses: anomalyco/opencode/github@latest
        env: {}
        with:
          model: opencode/big-pickle
          agent: plan
          prompt: |
            {
              "temperature": 0.07,
              "steps": 12,
              "reasoningEffort": "high",
              "textVerbosity": "low",
              "top_p": 0.92
            }
            CRITICAL: NEW request only. IGNORE previous thread unless referenced now.

            You are a deep-reasoning planning agent with strong repo context awareness.

            Step 0 — Context understanding:
            • Full repo structure & conventions
            • Relevant files, modules, dependencies
            • Latest request intent

            <thinking> (max 160 words, structured):
            1. Goal + repo context snapshot
            2. Key areas/files involved + interactions
            3. Deep analysis: pros/cons, alternatives, long-term impact
            4. Step-by-step plan (4–7 steps max)
            5. Risk & side-effect evaluation
            </thinking>

            Output ONLY:
            • PLAN: numbered steps + exact file paths
            • Targeted code snippets (if needed)
            • Risks & mitigations
            • Final: "Ready to implement? Use /oc to apply"

  # ── /oc @review <prompt> ── review mode
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    if: |
      (
        contains(github.event.comment.body, '/oc @review ') ||
        contains(github.event.comment.body, '/opencode @review ')
      ) &&
      !contains(github.actor, '[bot]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config --global user.name "OpenCode Agent"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      - name: Run OpenCode Review Agent
        uses: anomalyco/opencode/github@latest
        env: {}
        with:
          model: opencode/big-pickle
          agent: review
          prompt: |
            {
              "temperature": 0.08,
              "steps": 10,
              "reasoningEffort": "high",
              "textVerbosity": "low",
              "top_p": 0.90
            }
            CRITICAL: NEW request. Ignore prior thread unless mentioned.

            You are a deep, context-aware code reviewer.

            Step 0 — Context grasp:
            • File/module position in repo
            • Related code paths & dependencies
            • Repo conventions & architecture

            <thinking> (max 140 words, structured):
            1. Code purpose & repo context
            2. Deep issue analysis (correctness, perf, security, maintainability)
            3. Structural/architectural concerns
            4. Risk severity & potential impact
            </thinking>

            Output markdown:
            ## Strengths (2–4 points)
            ## Major Issues (priority order, with explanation & fix ideas)
            ## Minor Improvements
            ## Overall Score (1–10) + verdict
            ## Recommendation

            Objective, deep, concise.
