name: Aider + GLM AI Coding Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Deskripsi tugas untuk Aider (contoh: "fix bug di login page")'
        required: true
        type: string
      branch:
        description: 'Branch untuk dikerjakan (default: create new branch)'
        required: false
        default: ''
      model:
        description: 'GLM model (zhipu/glm-4-flash atau zhipu/glm-4)'
        required: false
        default: 'zhipu/glm-4-flash'

  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  aider-agent:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'issue_comment' && contains(github.event.comment.body, '/aider') }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: \~/.cache/pip
          key: \( {{ runner.os }}-pip-aider- \){{ hashFiles('**/aider-version.txt') || github.run_id }}
          restore-keys: ${{ runner.os }}-pip-aider-

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install aider-chat

      - name: Record Aider version (optional, improves cache stability)
        run: pip show aider-chat | grep Version > aider-version.txt || true

      - name: Configure Zhipu API Key
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          echo "export ZHIPU_API_KEY=$ZHIPU_API_KEY" >> $GITHUB_ENV

      - name: Determine task and branch
        id: prepare
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            comment="${{ github.event.comment.body }}"

            if [[ "$comment" != */aider* ]]; then
              echo "No /aider found in comment → skipping"
              exit 1
            fi

            TASK="${comment#*/aider}"
            TASK=$(echo "$TASK" | xargs)  # Trim leading/trailing whitespace

            if [ -z "$TASK" ]; then
              echo "No task found after /aider (empty after trim) → skipping"
              exit 1
            fi

            BRANCH="aider-glm-${{ github.run_id }}"
            echo "Comment trigger detected. Task: '$TASK'"
          else
            TASK="${{ inputs.task }}"
            BRANCH="${{ inputs.branch }}"
            if [ -z "$BRANCH" ]; then
              BRANCH="aider-glm-${{ github.run_id }}"
            fi
            echo "Manual dispatch. Task: '$TASK'"
          fi

          MODEL="${{ inputs.model || 'zhipu/glm-4-flash' }}"

          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"

      - name: Run Aider AI Agent
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          git config --global user.name "Aider-GLM Agent"
          git config --global user.email "aider-glm@github-actions"

          git checkout -b ${{ steps.prepare.outputs.branch }} || git checkout ${{ steps.prepare.outputs.branch }}

          aider \
            --model ${{ steps.prepare.outputs.model }} \
            --message "${{ steps.prepare.outputs.task }}" \
            --yes \
            --auto-commits \
            --no-pretty \
            --no-stream

      - name: Create Pull Request (if changes)
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Aider + GLM: ${{ steps.prepare.outputs.task }}"
          title: "AI Fix/Feature: ${{ steps.prepare.outputs.task }}"
          body: |
            **Task:** ${{ steps.prepare.outputs.task }}
            
            Generated by Aider + GLM ${{ steps.prepare.outputs.model }} via GitHub Actions
            
            - Model: ${{ steps.prepare.outputs.model }}
            - Workflow run: \( {{ github.server_url }}/ \){{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: ${{ steps.prepare.outputs.branch }}
          delete-branch: true
          labels: ai-generated, aider, glm

      - name: Comment result on issue/PR (if from comment)
        if: github.event_name == 'issue_comment'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            Aider + GLM sudah selesai memproses tugas:
            > ${{ steps.prepare.outputs.task }}

            Cek PR yang dibuat: \( {{ github.server_url }}/ \){{ github.repository }}/pulls?q=is%3Apr+head%3A${{ steps.prepare.outputs.branch }}
