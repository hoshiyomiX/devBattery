name: OpenCode Agent

permissions:
  id-token: write       # untuk OIDC jika provider butuh (opsional)
  contents: write       # untuk push commit / edit file
  issues: write         # untuk comment / close issue
  pull-requests: write  # untuk review comment & PR edits

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # hindari job hang terlalu lama

    # Hanya jalan jika comment mengandung trigger + bukan dari bot sendiri
    if: |
      (contains(github.event.comment.body, '/oc') || 
       contains(github.event.comment.body, '/opencode')) &&
      github.actor != 'opencode-agent[bot]' &&
      github.actor != github.event.repository.owner.login

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1          # cukup untuk kebanyakan kasus agent → lebih cepat
          persist-credentials: false

      - name: Configure Git identity for commits
        run: |
          git config --global user.name "OpenCode Agent"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      # Opsional: jika butuh push langsung tanpa config url replacement
      # OpenCode action biasanya handle sendiri kalau use_github_token: true

      - name: Run OpenCode Agent
        uses: anomalyco/opencode/github@latest
        env:
          # Ganti sesuai provider yang kamu pakai
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}     # contoh Claude
          # OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}       # contoh OpenAI
          # GOOGLE_API_KEY:     ${{ secrets.GOOGLE_API_KEY }}       # Gemini
          OPENCODE_API_KEY:   ${{ secrets.OPENCODE_API_KEY }}     # jika pakai opencode hosted
          ZAI_API_KEY:        ${{ secrets.ZAI_API_KEY }}          # jika pakai ZAI
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}         # hampir selalu dibutuhkan
        with:
          # Model yang direkomendasikan (pilih salah satu, sesuaikan dengan API key)
          model: opencode/glm-4.7-free     # atau gpt-4o, gemini-1.5-pro, dll
          # model: opencode/gpt-4o-mini-free     # jika pakai free tier opencode
          
          use_github_token: true                 # penting → biar action bisa push/comment otomatis
          agent: general                         # atau 'build', 'plan', 'explore', dll
          timeout: 1200                        # detik, jika ingin override default
