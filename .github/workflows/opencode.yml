name: OpenCode Agent

permissions:
  id-token: write       # optional, tapi aman untuk OIDC kalau dibutuhkan
  contents: write       # wajib untuk push/commit/branch
  issues: write
  pull-requests: write

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: |
      (contains(github.event.comment.body, '/oc') || 
       contains(github.event.comment.body, '/opencode')) &&
      !contains(github.actor, '[bot]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4   # v4 stabil, v6 kadang quirky di beberapa kasus
        with:
          fetch-depth: 1
          persist-credentials: false   # penting: sesuai docs OpenCode

      - name: Configure Git identity
        run: |
          git config --global user.name "OpenCode Agent"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      # JANGAN tambah step manual git config url atau set-url origin — biarkan action handle via app token

      - name: Run OpenCode Agent
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY:   ${{ secrets.OPENCODE_API_KEY }}
          # GITHUB_TOKEN:       ${{ github.token }}   → HAPUS ini kalau pakai app token default
          # Jangan set GITHUB_TOKEN manual kecuali kamu sengaja mau override ke runner token
        with:
          model: opencode/glm-4.7-free   # atau model lain yang kamu pakai
          # HAPUS use_github_token: true   → biar pakai app token
          agent: general

          # Custom params kamu tetap bisa
          prompt: |
            {
              "temperature": 0.2,
              "steps": 12,
              "reasoningEffort": "high"
            }
            Process the request with high precision and limited iterations.
