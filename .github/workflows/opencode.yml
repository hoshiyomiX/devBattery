name: opencode

# Permissions level workflow (wajib untuk OIDC & GitHub API actions)
permissions:
  id-token: write          # FIX utama: izinkan fetch OIDC token
  contents: write          # Untuk checkout, create branch, commit
  issues: write            # Untuk comment di issues
  pull-requests: write     # Untuk comment di PR & open PR baru

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    runs-on: ubuntu-latest
    if: contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}  # atau GLM_API_KEY kalau nama secret beda
          MODEL: zai/glm-4.7                     # coba ini dulu, atau glm-4.7 kalau pakai Zen proxy
          # Optional: fallback ke GITHUB_TOKEN kalau OIDC masih bermasalah
          # GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Optional kalau butuh override
          use_github_token: false  # default false kalau pakai OIDC
          # agent: default           # atau 'plan', 'fix', dll kalau mau spesifik
