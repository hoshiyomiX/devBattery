name: OpenCode Agent

permissions:
  id-token: write
  contents: write       # Critical for push / branch creation
  issues: write
  pull-requests: write

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: |
      (contains(github.event.comment.body, '/oc') || 
       contains(github.event.comment.body, '/opencode')) &&
      !contains(github.actor, '[bot]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4   # v4 is very stable; v6 sometimes has quirks
        with:
          fetch-depth: 1
          persist-credentials: false   # Keep this — safer

      - name: Configure Git identity
        run: |
          git config --global user.name "OpenCode Agent"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      # Remove the old "Setup Git HTTPS credential" step entirely — it's causing issues or not needed

      - name: Run OpenCode Agent
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY:   ${{ secrets.OPENCODE_API_KEY }}
          ZAI_API_KEY:        ${{ secrets.ZAI_API_KEY }}
          GITHUB_TOKEN:       ${{ github.token }}   # Use github.token (built-in) instead of secrets.GITHUB_TOKEN
        with:
          model: opencode/glm-4.7-free   # or your preferred model
          use_github_token: true           # This tells OpenCode to use the runner's token for git ops
          agent: general
          # Your custom prompt overrides if needed
          prompt: |
            {
              "temperature": 0.2,
              "steps": 12,
              "reasoningEffort": "high"
            }
            Follow standard flow but apply strict parameters.
