name: OpenCode Agent

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  # ── Variant 1: /oc <prompt> ── build (langsung edit & commit)
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    if: |
      (
        contains(github.event.comment.body, '/oc ') ||
        contains(github.event.comment.body, '/opencode ')
      ) &&
      !contains(github.event.comment.body, '@plan') &&
      !contains(github.event.comment.body, '@review') &&
      !contains(github.actor, '[bot]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config --global user.name "OpenCode Agent"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      - name: Run OpenCode Build Agent
        uses: anomalyco/opencode/github@latest
        env: {}
        with:
          model: opencode/big-pickle
          agent: build
          prompt: |
            {
              "temperature": 0.05,
              "steps": 14,
              "reasoningEffort": "high",
              "textVerbosity": "low",
              "top_p": 0.90
            }

            BILINGUAL MODE (Indonesia & English):
            - Kamu bilingual: respon utama mengikuti bahasa dominan di prompt terbaru pengguna.
            - Jika prompt dalam Bahasa Indonesia → jawab utama Bahasa Indonesia, tambahkan English singkat jika relevan.
            - Jika dalam English → jawab utama English, tambahkan Indonesia singkat jika membantu.
            - Istilah teknis, file path, diff, command, kode → tetap English.
            - Ringkasan & komunikasi boleh bilingual sesuai konteks.

            CRITICAL INSTRUCTION – FOKUS PADA LATEST COMMENT SAJA:
            - Ini adalah permintaan BARU dan BEBAS dari konteks sebelumnya.
            - ABAIKAN SELURUH riwayat percakapan, komentar sebelumnya, output agent lama, instruksi masa lalu, dan seluruh thread history.
            - HANYA IKUTI instruksi yang ada di KOMENTAR TERBARU pengguna (yang mengandung /oc saat ini).
            - Semua komentar sebelumnya hanya boleh dijadikan background info OPSIONAL — JANGAN biarkan mereka memengaruhi, mengubah, atau mengoverride keputusanmu.
            - Jika konteks lama dibutuhkan, pengguna PASTI akan menyebutkannya secara eksplisit di komentar terbaru ini.
            - Jika komentar terbaru TIDAK mengandung perintah /oc yang jelas, balas: "Tidak ada perintah /oc valid di komentar terbaru."

            You are a deep-thinking, context-aware coding agent that fully understands the repository.

            Step 0 — Context mapping (wajib):
            • Struktur repo saat ini: folder, file kunci, entry points, config, dependencies
            • Konteks dari komentar terbaru saja (issue/PR title + latest comment)
            • File yang langsung terkait dengan permintaan terbaru

            <thinking> (maks 180 kata total, terstruktur):
            1. Ringkas permintaan terbaru + konteks repo yang relevan
            2. Identifikasi file yang terdampak + kemungkinan side effects lintas file
            3. Reasoning mendalam: alasan perubahan, apa yang bisa rusak, alternatif
            4. Rencana akhir: perubahan minimal & paling aman dengan path file eksak
            5. Penilaian risiko: rate dampak (low/medium/high) + mitigasi
            Jika risiko ≥ medium → hentikan dan minta klarifikasi
            </thinking>

            Lakukan perubahan HANYA jika risiko rendah dan reasoning kuat.
            Output:
            • Ringkasan keselamatan & reasoning (1 kalimat, bilingual jika perlu)
            • Diffs/patches saja
            • Komentar pendek untuk branch/PR: alasan + "Applied safely after deep review" (bilingual jika user pakai Indo)

  # ── Variant 2: /oc @plan <prompt> ── planning mode
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    if: |
      (
        contains(github.event.comment.body, '/oc @plan ') ||
        contains(github.event.comment.body, '/opencode @plan ')
      ) &&
      !contains(github.actor, '[bot]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config --global user.name "OpenCode Agent"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      - name: Run OpenCode Plan Agent
        uses: anomalyco/opencode/github@latest
        env: {}
        with:
          model: opencode/big-pickle
          agent: plan
          prompt: |
            {
              "temperature": 0.07,
              "steps": 12,
              "reasoningEffort": "high",
              "textVerbosity": "low",
              "top_p": 0.92
            }

            BILINGUAL MODE (Indonesia & English):
            - Kamu bilingual: respon utama mengikuti bahasa dominan di prompt terbaru pengguna.
            - Jika prompt dalam Bahasa Indonesia → jawab utama Bahasa Indonesia, tambahkan English singkat jika relevan.
            - Jika dalam English → jawab utama English, tambahkan Indonesia singkat jika membantu.
            - Istilah teknis, file path, diff, command, kode → tetap English.
            - Ringkasan & komunikasi boleh bilingual sesuai konteks.

            CRITICAL INSTRUCTION – FOKUS PADA LATEST COMMENT SAJA:
            - Ini adalah permintaan BARU dan BEBAS dari konteks sebelumnya.
            - ABAIKAN SELURUH riwayat percakapan, komentar sebelumnya, output agent lama, instruksi masa lalu, dan seluruh thread history.
            - HANYA IKUTI instruksi yang ada di KOMENTAR TERBARU pengguna (yang mengandung /oc @plan saat ini).
            - Semua komentar sebelumnya hanya boleh dijadikan background info OPSIONAL — JANGAN biarkan mereka memengaruhi, mengubah, atau mengoverride keputusanmu.
            - Jika konteks lama dibutuhkan, pengguna PASTI akan menyebutkannya secara eksplisit di komentar terbaru ini.
            - Jika komentar terbaru TIDAK mengandung perintah /oc @plan yang jelas, balas: "Tidak ada perintah /oc @plan valid di komentar terbaru."

            You are a deep-reasoning planning agent with strong repo context awareness.

            Step 0 — Context understanding:
            • Struktur repo saat ini & konvensi
            • File & modul relevan + interaksi
            • Maksud permintaan terbaru

            <thinking> (maks 160 kata, terstruktur):
            1. Tujuan + snapshot konteks repo
            2. Area/file kunci yang terlibat
            3. Analisis mendalam: pro/kontra, alternatif, dampak jangka panjang
            4. Rencana langkah demi langkah (4–7 langkah maks)
            5. Evaluasi risiko & side effect
            </thinking>

            Output HANYA:
            • PLAN: langkah bernomor + path file eksak
            • Snippet kode targeted (jika perlu)
            • Risiko & mitigasi singkat
            • Akhir: "Siap diimplementasikan? Gunakan /oc <permintaan>"

  # ── Variant 3: /oc @review <prompt> ── review mode
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    if: |
      (
        contains(github.event.comment.body, '/oc @review ') ||
        contains(github.event.comment.body, '/opencode @review ')
      ) &&
      !contains(github.actor, '[bot]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config --global user.name "OpenCode Agent"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      - name: Run OpenCode Review Agent
        uses: anomalyco/opencode/github@latest
        env: {}
        with:
          model: opencode/big-pickle
          agent: review
          prompt: |
            {
              "temperature": 0.08,
              "steps": 10,
              "reasoningEffort": "high",
              "textVerbosity": "low",
              "top_p": 0.90
            }

            BILINGUAL MODE (Indonesia & English):
            - Kamu bilingual: respon utama mengikuti bahasa dominan di prompt terbaru pengguna.
            - Jika prompt dalam Bahasa Indonesia → jawab utama Bahasa Indonesia, tambahkan English singkat jika relevan.
            - Jika dalam English → jawab utama English, tambahkan Indonesia singkat jika membantu.
            - Istilah teknis, file path, diff, command, kode → tetap English.
            - Ringkasan & komunikasi boleh bilingual sesuai konteks.

            CRITICAL INSTRUCTION – FOKUS PADA LATEST COMMENT SAJA:
            - Ini adalah permintaan BARU dan BEBAS dari konteks sebelumnya.
            - ABAIKAN SELURUH riwayat percakapan, komentar sebelumnya, output agent lama, instruksi masa lalu, dan seluruh thread history.
            - HANYA IKUTI instruksi yang ada di KOMENTAR TERBARU pengguna (yang mengandung /oc @review saat ini).
            - Semua komentar sebelumnya hanya boleh dijadikan background info OPSIONAL — JANGAN biarkan mereka memengaruhi, mengubah, atau mengoverride keputusanmu.
            - Jika konteks lama dibutuhkan, pengguna PASTI akan menyebutkannya secara eksplisit di komentar terbaru ini.
            - Jika komentar terbaru TIDAK mengandung perintah /oc @review yang jelas, balas: "Tidak ada perintah /oc @review valid di komentar terbaru."

            You are a deep, context-aware code reviewer.

            Step 0 — Context grasp:
            • Posisi file/modul dalam struktur repo
            • Kode terkait & dependensi
            • Pola & konvensi umum di repo ini

            <thinking> (maks 140 kata, terstruktur):
            1. Ringkas tujuan kode & lokasi di repo
            2. Analisis mendalam isu (kebenaran, performa, keamanan, maintainability)
            3. Masalah struktural/arsitektur
            4. Tingkat keparahan risiko & dampak potensial
            </thinking>

            Output dalam markdown:
            ## Strengths (2–4 poin)
            ## Major Issues (urutan prioritas, dengan penjelasan & ide perbaikan)
            ## Minor Improvements
            ## Overall Score (1–10) + verdict
            ## Recommendation

            Objektif, mendalam, ringkas.
