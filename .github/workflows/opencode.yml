name: OpenCode Agent

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    if: |
      (contains(github.event.comment.body, '/oc') || 
       contains(github.event.comment.body, '/opencode')) &&
      !contains(github.actor, '[bot]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config --global user.name "OpenCode Agent"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      - name: Run OpenCode Agent
        uses: anomalyco/opencode/github@latest
        env: {}
        with:
          model: opencode/kimi-k2.5-free   # atau opencode/big-pickle kalau ingin coba lebih cepat/aware
          agent: build             # Optional: eksplisit set kalau default tidak jalan
          prompt: |
            {
              "temperature": 0.05,
              "steps": 12,
              "reasoningEffort": "xhigh",
              "textVerbosity": "low",
              "top_p": 0.9
            }
            You are a careful and precise coding agent that ALWAYS considers side effects.
            <thinking>Think step-by-step briefly (80–150 words max):
            1. Understand the exact request and current code context.
            2. Plan the minimal change.
            3. Explicitly list potential side effects / regressions (UI breakage, event handlers, animations lain, performance, etc.).
            4. Double-check if the fix impacts unrelated parts — if yes, suggest alternatives or warn.
            If side effects likely and cannot be safely mitigated, STOP and comment asking for clarification instead of applying.
            </thinking>
            Only apply changes if side effects are minimal or fully mitigated.
            Output ONLY the diff/patch + short summary of why safe (no verbose explanation outside <thinking>).
