name: OpenCode Agent

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # Naikkan biar aman kalau model free lagi lambat

    if: |
      (contains(github.event.comment.body, '/oc') || 
       contains(github.event.comment.body, '/opencode')) &&
      !contains(github.actor, '[bot]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config --global user.name "OpenCode Agent"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      - name: Run OpenCode Agent
        uses: anomalyco/opencode/github@latest
        env:
          # Hapus semua API key env kalau pakai free model OpenCode native
          # GOOGLE_GENERATIVE_AI_API_KEY:   ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}  → hapus
          # OPENCODE_API_KEY: ... → hapus kalau free
        with:
          model: opencode/glm-4.7-free   # ← Coba ini dulu (prefix opencode/ sering work)
          # Alternatif kalau tidak jalan: glm-4.7-free (tanpa prefix)
          # Atau kalau kamu punya Z.ai key: zai-coding-plan/glm-4.7-flash (berbayar)
          agent: general

          prompt: |
            {
              "temperature": 0.2,
              "steps": 12,
              "reasoningEffort": "high"
            }
            Process the request with high precision and limited iterations.
