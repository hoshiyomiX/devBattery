name: opencode

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    runs-on: ubuntu-latest
    if: contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}  # atau GLM_API_KEY kalau nama secret beda
          # Optional fallback kalau Z.ai pakai Anthropic-compatible:
          # ANTHROPIC_API_KEY: ${{ secrets.ZAI_API_KEY }}
        with:
          model: zai/glm-4.7  # <-- Ini format yang paling sering work untuk Z.ai/GLM di OpenCode (tanpa prefix zai/)
          agent: default
