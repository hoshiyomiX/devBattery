name: opencode

permissions:
  id-token: write       # Untuk OIDC kalau perlu
  contents: write       # Wajib untuk commit/branch
  issues: write         # Untuk comment di issue
  pull-requests: write  # Untuk comment/PR di PR

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    runs-on: ubuntu-latest
    if: contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false  # Penting agar tidak conflict credential

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          # MODEL pindah ke with (seperti sebelumnya)
        with:
          model: zai/glm-4.7                  # atau zai/glm-4.7 kalau prefix dibutuhkan
          use_github_token: true          # <-- FIX KUNCI: Pakai GITHUB_TOKEN runner, bukan app bot
          agent: default                  # optional
