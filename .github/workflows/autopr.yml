name: AutoPR

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  autopr:
    runs-on: ubuntu-latest
    timeout-minutes: 30 
    
    # Hanya jalan jika ada komentar /autopr
    if: contains(github.event.comment.body, '/autopr')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AutoPR
        uses: irgolic/autopr@main  # <--- PERBAIKAN 1: Gunakan @main, bukan @v1
        env:
          # API Key dari Zhipu AI (BigModel)
          OPENAI_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          
          # PERBAIKAN 2: Gunakan OPENAI_BASE_URL (Standar OpenAI Python), bukan API_BASE
          # Ini akan mengarahkan request ke Zhipu, bukan OpenAI
          OPENAI_BASE_URL: https://open.bigmodel.cn/api/paas/v4/
          
          # Model gratis & cepat dari Zhipu
          MODEL: glm-4.7-flash
          
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
