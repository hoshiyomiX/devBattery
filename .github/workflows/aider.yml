name: AI Agent (Aider + Zai/GLM)

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ai-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/ai')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '/ai'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: pip install aider-chat

      - name: Configure Git
        run: |
          git config --global user.name "AI Agent"
          git config --global user.email "ai-agent[bot]@users.noreply.github.com"

      - name: Run Aider with Zai/GLM
        env:
          # 1. Kredensial API
          OPENAI_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          OPENAI_API_BASE: https://open.bigmodel.cn/api/paas/v4/
          
          # 2. Token untuk GitHub CLI (Wajib agar gh pr create jalan)
          GH_TOKEN: ${{ github.token }}
          
          # 3. Ambil pesan dari Issue/Komentar
          PROMPT: |
            ${{ github.event.comment.body }}
            ${{ github.event.issue.body }}
        run: |
          # Buat branch baru
          BRANCH_NAME="ai/fix-$(date +%s)"
          git checkout -b $BRANCH_NAME

          # --- PERBAIKAN 1: Bersihkan pesan dari perintah '/ai' ---
          # Kita hapus kata '/ai' di awal pesan agar Aider tidak bingung
          CLEANED_PROMPT=$(echo "$PROMPT" | sed 's/^\/ai //')

          echo "Running Aider with prompt: $CLEANED_PROMPT"

          # Jalankan Aider
          # --no-show-model-warnings: Matikan warning context window (supaya log bersih)
          aider --model=openai/glm-4.7-flash \
                --message="$CLEANED_PROMPT" \
                --yes \
                --no-auto-commits \
                --commit-prompt="Implement the requested changes" \
                --no-show-model-warnings

          # Push perubahan
          git push origin $BRANCH_NAME

          # --- PERBAIKAN 2: Membuat PR ---
          # Karena GH_TOKEN sudah diset di env, 'gh' sekarang bisa bekerja
          gh pr create --title "AI: Resolve issue" --body "Auto-generated by Aider using GLM-4-Flash" || echo "PR might already exist or no changes made"
