name: Aider + Gemini/GLM AI Coding Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Deskripsi tugas untuk Aider (contoh: "fix bug di login page")'
        required: true
        type: string
      branch:
        description: 'Branch untuk dikerjakan (default: create new branch)'
        required: false
        default: ''
      model:
        description: 'Model (gemini/gemini-2.5-flash atau zhipu/glm-4-flash)'
        required: false
        default: 'gemini/gemini-2.5-flash'

  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  aider-agent:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/aider')) }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: \~/.cache/pip
          key: \( {{ runner.os }}-pip-aider- \){{ hashFiles('**/aider-version.txt') || github.run_id }}
          restore-keys: ${{ runner.os }}-pip-aider-

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install aider-chat

      - name: Record Aider version
        run: pip show aider-chat | grep Version > aider-version.txt || true

      - name: Configure API Key
        env:
          API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.ZHIPU_API_KEY }}
        run: |
          echo "export API_KEY=$API_KEY" >> $GITHUB_ENV

      - name: Determine task and branch
        id: prepare
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            comment="${{ github.event.comment.body }}"

            if [[ "$comment" != */aider* ]]; then
              echo "No /aider command found → skipping"
              exit 0
            fi

            TASK="${comment#*/aider}"
            TASK=$(echo "$TASK" | xargs)

            if [ -z "$TASK" ]; then
              echo "No meaningful task after /aider → skipping"
              exit 0
            fi

            BRANCH="aider-ai-${{ github.run_id }}"
            echo "Comment trigger → Task: '$TASK'"
          else
            TASK="${{ inputs.task }}"
            BRANCH="${{ inputs.branch }}"
            if [ -z "$BRANCH" ]; then
              BRANCH="aider-ai-${{ github.run_id }}"
            fi
            echo "Manual dispatch → Task: '$TASK'"
          fi

          MODEL="${{ inputs.model || 'gemini/gemini-2.5-flash' }}"

          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"

      - name: Run Aider
        env:
          API_KEY: ${{ env.API_KEY }}
        run: |
          git config --global user.name "Aider AI Agent"
          git config --global user.email "aider-ai@github-actions"

          git checkout -b ${{ steps.prepare.outputs.branch }} || git checkout ${{ steps.prepare.outputs.branch }}

          aider \
            --model ${{ steps.prepare.outputs.model }} \
            --message "${{ steps.prepare.outputs.task }}" \
            --yes \
            --auto-commits \
            --no-pretty \
            --no-stream

      - name: Get repository default branch
        id: get-default
        run: |
          set -e

          # Run API call and capture output/error
          DEFAULT_BRANCH=\( (gh api repos/ \){{ github.repository }} --jq .default_branch 2>/tmp/gh_err || echo "")

          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "Failed to detect default branch via gh api. Error output:"
            cat /tmp/gh_err || echo "No error file content"
            echo "Falling back to known default: renuked"
            DEFAULT_BRANCH="renuked"
          fi

          echo "default_branch=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Detected default branch: $DEFAULT_BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug branches before PR
        run: |
          echo "Current checked-out branch: $(git branch --show-current)"
          echo "Intended head branch: ${{ steps.prepare.outputs.branch }}"
          echo "Detected base branch: ${{ steps.get-default.outputs.default_branch }}"

      - name: Create Pull Request (if changes exist)
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Aider + AI: ${{ steps.prepare.outputs.task }}"
          title: "AI Fix/Feature: ${{ steps.prepare.outputs.task }}"
          body: |
            **Task:** ${{ steps.prepare.outputs.task }}
            
            Generated by Aider + ${{ steps.prepare.outputs.model }} via GitHub Actions
            
            - Model: ${{ steps.prepare.outputs.model }}
            - Workflow run: \( {{ github.server_url }}/ \){{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: ${{ steps.prepare.outputs.branch }}
          base: ${{ steps.get-default.outputs.default_branch }}
          delete-branch: true
          labels: ai-generated, aider
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: hoshiyomiX <138315928+hoshiyomiX@users.noreply.github.com>
          signoff: false
          sign-commits: false
          draft: false
          maintainer-can-modify: true

      - name: Comment result (if from comment)
        if: github.event_name == 'issue_comment'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            Aider selesai memproses:
            > ${{ steps.prepare.outputs.task }}

            Cek PR: \( {{ github.server_url }}/ \){{ github.repository }}/pulls?q=is%3Apr+head%3A${{ steps.prepare.outputs.branch }}
