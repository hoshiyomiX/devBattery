name: AI Agent (Aider + GLM-4.7-Flash)

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ai-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/ai')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '/ai'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: pip install aider-chat

      - name: Configure Git
        run: |
          git config --global user.name "AI Agent"
          git config --global user.email "ai-agent[bot]@users.noreply.github.com"

      - name: Run Aider with GLM-4.7-Flash (Auto Commit)
        env:
          OPENAI_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          OPENAI_API_BASE: https://open.bigmodel.cn/api/paas/v4/
          GH_TOKEN: ${{ github.token }}
          
          PROMPT: |
            ${{ github.event.comment.body }}
            ${{ github.event.issue.body }}
        run: |
          BRANCH_NAME="ai/fix-$(date +%s)"
          git checkout -b $BRANCH_NAME

          # Bersihkan prompt
          CLEANED_PROMPT=$(echo "$PROMPT" | sed 's/^\/ai //')

          # --- PERBAIKAN FINAL ---
          # 1. Menambahkan prefix 'openai/' WAJIB agar litellm mengenali format request
          #    untuk endpoint custom (Zhipu).
          # 2. Memaksa editor model sama persis agar tidak crash saat summarization.
          aider --model openai/glm-4.7-flash \
                --editor-model openai/glm-4.7-flash \
                --message="$CLEANED_PROMPT" \
                --commit-prompt="Generate a concise commit message" \
                --yes \
                --no-show-model-warnings

          # Push
          git push origin $BRANCH_NAME

          # Buat PR
          gh pr create --title "AI: Resolve issue" --body "Auto-generated by Aider" || echo "PR already exists"
