name: Aider + Gemini AI Coding Agent

on:
  workflow_dispatch:    # Bisa di-trigger manual dari Actions tab
    inputs:
      task:
        description: 'Deskripsi tugas untuk Aider (contoh: "fix bug di login page" atau "tambah dark mode toggle")'
        required: true
        type: string
      branch:
        description: 'Branch untuk dikerjakan (default: create new branch)'
        required: false
        default: ''
      model:
        description: 'Gemini model (gemini/gemini-2.5-pro atau gemini/gemini-2.5-flash)'
        required: false
        default: 'gemini/gemini-2.5-flash'

  # (Opsional) Trigger dari comment di issue/PR
  issue_comment:
    types: [created]

permissions:
  contents: write          # Penting agar bisa commit & push
  pull-requests: write     # Bisa buat PR
  issues: write            # Bisa comment di issue

jobs:
  aider-agent:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '/aider')
      )
      
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python & cache pip
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install aider-chat
          
      - name: Configure Gemini API Key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "export GEMINI_API_KEY=$GEMINI_API_KEY" >> $GITHUB_ENV

      - name: Determine task and branch
        id: prepare
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            TASK=\( (echo " \){{ github.event.comment.body }}" | sed -n 's/.*\/aider \(.*\)/\1/p' | xargs)
            if [ -z "$TASK" ]; then
              echo "No task found after /aider command → skipping"
              exit 1
            fi
            BRANCH="aider-gemini-${{ github.run_id }}"
            echo "Comment trigger detected. Task: $TASK"
          else
            TASK="${{ inputs.task }}"
            BRANCH="${{ inputs.branch }}"
            if [ -z "$BRANCH" ]; then
              BRANCH="aider-gemini-${{ github.run_id }}"
            fi
          fi

          MODEL="${{ inputs.model || 'gemini/gemini-2.5-flash' }}"

          echo "task=$TASK" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "model=$MODEL" >> $GITHUB_OUTPUT

      - name: Run Aider AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git config --global user.name "Aider-Gemini Agent"
          git config --global user.email "aider-gemini@github-actions"

          # Buat & checkout branch baru
          git checkout -b ${{ steps.prepare.outputs.branch }} || git checkout ${{ steps.prepare.outputs.branch }}

          # Jalankan Aider (non-interactive, single shot)
          aider \
            --model ${{ steps.prepare.outputs.model }} \
            --message "${{ steps.prepare.outputs.task }}" \
            --yes \
            --auto-commits \
            --no-pretty  \
            --no-stream

      - name: Create Pull Request (jika ada perubahan)
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Aider + Gemini: ${{ steps.prepare.outputs.task }}"
          title: "AI Fix/Feature: ${{ steps.prepare.outputs.task }}"
          body: |
            **Task:** ${{ steps.prepare.outputs.task }}
            
            Generated by Aider + Gemini ${{ steps.prepare.outputs.model }} via GitHub Actions
            
            - Model: ${{ steps.prepare.outputs.model }}
            - Workflow run: \( {{ github.server_url }}/ \){{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: ${{ steps.prepare.outputs.branch }}
          delete-branch: true
          labels: ai-generated, aider, gemini

      - name: Comment result on issue/PR (jika dipicu dari comment)
        if: github.event_name == 'issue_comment'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            Aider + Gemini sudah selesai memproses tugas:
            > ${{ steps.prepare.outputs.task }}

            Cek PR yang dibuat: \( {{ github.server_url }}/ \){{ github.repository }}/pulls?q=is%3Apr+head%3A${{ steps.prepare.outputs.branch }}
