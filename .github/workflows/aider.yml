name: AI Agent (Aider + GLM-4.7-Flash)

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ai-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/ai')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '/ai'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: pip install aider-chat

      - name: Configure Git
        run: |
          git config --global user.name "AI Agent"
          git config --global user.email "ai-agent[bot]@users.noreply.github.com"

      - name: Run Aider with GLM-4.7-Flash (Auto Commit)
        env:
          OPENAI_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          OPENAI_API_BASE: https://open.bigmodel.cn/api/paas/v4/
          GH_TOKEN: ${{ github.token }}
          
          PROMPT: |
            ${{ github.event.comment.body }}
            ${{ github.event.issue.body }}
        run: |
          BRANCH_NAME="ai/fix-$(date +%s)"
          git checkout -b $BRANCH_NAME

          # Bersihkan prompt dari '/ai'
          CLEANED_PROMPT=$(echo "$PROMPT" | sed 's/^\/ai //')

          # --- KONFIGURASI AUTO COMMIT ---
          # 1. Model: glm-4.7-flash (Nama model Zhipu native)
          # 2. --commit-prompt: INI yang membuat Auto-Commit jalan
          # 3. --editor-model: Diset sama agar konsisten
          aider --model glm-4.7-flash \
                --editor-model glm-4.7-flash \
                --message="$CLEANED_PROMPT" \
                --commit-prompt="Generate a concise commit message" \
                --yes \
                --no-show-model-warnings

          # Push hasil commit otomatis dari Aider
          git push origin $BRANCH_NAME

          # Buat Pull Request
          gh pr create --title "AI: Resolve issue" --body "Auto-generated by Aider using GLM-4.7-Flash" || echo "PR already exists"
