name: AI Agent (Gemini 2.5 Flash)

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ai-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/ai')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '/ai'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: pip install --upgrade aider-chat  # upgrade untuk dapat model Gemini terbaru

      - name: Configure Git
        run: |
          git config --global user.name "AI Agent"
          git config --global user.email "ai-agent[bot]@users.noreply.github.com"

      - name: Cleanup Old Junk Branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Menghapus branch 'ai/fix-*' lama..."
          OLD_BRANCHES=$(git ls-remote --heads origin "ai/fix-*" | awk '{print $2}' | sed 's|refs/heads/||')
          
          if [ -n "$OLD_BRANCHES" ]; then
            for BRANCH in $OLD_BRANCHES; do
              echo "Menghapus branch: $BRANCH"
              git push origin --delete "$BRANCH" || true
            done
          else
            echo "Tidak ada branch lama yang perlu dibersihkan."
          fi

      - name: Run Aider (Gemini 2.5 Flash)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # <-- Simpan API key di repo Settings > Secrets and variables > Actions > New repository secret (nama: GEMINI_API_KEY)
          GH_TOKEN: ${{ github.token }}
          
          PROMPT: |
            ${{ github.event.comment.body }}
            ${{ github.event.issue.body }}
        run: |
          BRANCH_NAME="ai/fix-$(date +%s)"
          git checkout -b $BRANCH_NAME
          
          CLEANED_PROMPT=$(echo "$PROMPT" | sed 's/^\/ai\s*//')  # hapus /ai di awal kalau dari comment

          aider --model gemini/gemini-2.5-flash \
                --editor-model gemini/gemini-2.5-flash \
                --message="$CLEANED_PROMPT" \
                --commit-prompt="Generate a concise commit message in English, start with emoji relevant to change" \
                --yes \
                --no-show-model-warnings \
                --reasoning-effort high

          echo "Checking for changes..."
          if git diff --cached --quiet && git diff --quiet; then
            echo "No changes made by Aider. Cleaning up branch..."
            git checkout -
            git branch -D $BRANCH_NAME
            git push origin --delete $BRANCH_NAME || true
          else
            echo "Changes detected. Committing, pushing, and creating PR..."
            git add .
            git commit --amend --no-edit || true  # kalau sudah ada commit dari Aider
            
            git push origin $BRANCH_NAME --force-with-lease
            
            # Ambil pesan commit terakhir sebagai title PR
            COMMIT_MSG=$(git log -1 --pretty=%B | head -n1)
            
            gh pr create --title "$COMMIT_MSG" \
                         --body "## 🤖 Auto-Generated PR by Gemini 2.5 Flash\n\n### 📝 Summary\n\n$COMMIT_MSG\n\n---\n*Prompt trigger: /ai*\n*Model: gemini-2.5-flash*" \
                         --base ${{ github.event.repository.default_branch }} \
                         || echo "PR creation failed (mungkin sudah ada atau conflict)"
          fi

      - name: Add Robot Reaction (🤖)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            SUBJECT_ID="${{ github.event.comment.node_id }}"
          else
            SUBJECT_ID="${{ github.event.issue.node_id }}"
          fi
          
          gh api graphql -f query='mutation($id: ID!) { addReaction(input: {subjectId: $id, content: ROBOT}) { reaction { content } } }' -f id=$SUBJECT_ID || echo "Failed to add 🤖 reaction"
