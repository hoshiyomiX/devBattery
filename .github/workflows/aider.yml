name: AI Agent (Aider + Zai/GLM)

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ai-agent:
    runs-on: ubuntu-latest
    # Timeout lebih panjang untuk AI berpikir
    timeout-minutes: 30
    
    # Hanya jalan jika ada komentar /ai
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/ai')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '/ai'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: pip install aider-chat

      - name: Configure Git
        run: |
          git config --global user.name "AI Agent"
          git config --global user.email "ai-agent[bot]@users.noreply.github.com"

      - name: Run Aider with Zai/GLM
        env:
          # 1. Gunakan API Key Zhipu/Zai Anda
          OPENAI_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          
          # 2. Wajib set Base URL ke Zhipu
          OPENAI_API_BASE: https://open.bigmodel.cn/api/paas/v4/
          
          # 3. Ambil instruksi dari Issue/Komentar
          PROMPT: |
            ${{ github.event.comment.body }}
            ${{ github.event.issue.body }}
        run: |
          # Buat branch baru
          BRANCH_NAME="ai/fix-$(date +%s)"
          git checkout -b $BRANCH_NAME

          # Jalankan Aider
          # --model: Kita menyamakan model GLM dengan alias openai agar Aider mengenali
          # --message: Instruksi coding
          aider --model=openai/glm-4-flash \
                --message="$PROMPT" \
                --yes \
                --no-auto-commits \
                --commit-prompt="Implement the requested changes"

          # Push perubahan
          git push origin $BRANCH_NAME

          # Buat Pull Request
          gh pr create --title "AI: Resolve issue" --body "Auto-generated by Aider using GLM-4-Flash" || echo "PR might already exist or no changes made"
