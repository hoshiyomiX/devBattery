name: AI Agent (Aider - Anti Loop)

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ai-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/ai')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '/ai'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: pip install aider-chat

      - name: Configure Git
        run: |
          git config --global user.name "AI Agent"
          git config --global user.email "ai-agent[bot]@users.noreply.github.com"

      - name: Run Aider (Safe Mode)
        env:
          OPENAI_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          OPENAI_API_BASE: https://open.bigmodel.cn/api/paas/v4/
          GH_TOKEN: ${{ github.token }}
          
          PROMPT: |
            ${{ github.event.comment.body }}
            ${{ github.event.issue.body }}
        run: |
          BRANCH_NAME="ai/fix-$(date +%s)"
          git checkout -b $BRANCH_NAME
          CLEANED_PROMPT=$(echo "$PROMPT" | sed 's/^\/ai //')

          # --- PENGATURAN ANTI LOOP ---
          # 1. --temperature 0: Memaksa AI deterministik (kaku), mengurangi khayalan/loop.
          # 2. --no-weak-model-prompt: Matikan fitur "bantuan internal" yang sering memicu loop.
          # 3. --max-tokens 4096: Batasi output supaya tidak berlarut-larut.
          # 4. MODEL: Kita balik ke glm-4-flash (Standard Coding Model).
          aider --model openai/glm-4-flash \
                --editor-model openai/glm-4-flash \
                --temperature 0 \
                --max-tokens 4096 \
                --no-weak-model-prompt \
                --message="$CLEANED_PROMPT" \
                --commit-prompt="Generate a concise commit message" \
                --yes \
                --no-show-model-warnings

          git push origin $BRANCH_NAME
          gh pr create --title "AI: Resolve issue" --body "Auto-generated by Aider" || echo "PR already exists"
