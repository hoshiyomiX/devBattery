name: AI Agent (Gemini 2.5 Flash)

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ai-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/ai') && 
       (github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR' || github.event.comment.author_association == 'OWNER')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '/ai'))

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install --upgrade aider-chat

      - run: |
          git config --global user.name "AI Agent"
          git config --global user.email "ai-agent[bot]@users.noreply.github.com"

      - name: Cleanup old ai/fix-* branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for b in $(git ls-remote --heads origin "refs/heads/ai/fix-*" | awk '{print $2}' | sed 's|refs/heads/||'); do
            echo "Deleting old branch $b"
            git push origin --delete "$b" || true
          done

      - name: Determine prompt
        id: get_prompt
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "prompt=${{ github.event.comment.body }}" >> "$GITHUB_OUTPUT"
          else
            echo "prompt=${{ github.event.issue.body }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Aider (Gemini 2.5 Flash)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PROMPT: ${{ steps.get_prompt.outputs.prompt }}
        run: |
          set -euo pipefail

          BRANCH="ai/fix-$(date +%s)"
          git checkout -b "$BRANCH"

          CLEAN_PROMPT=$(echo "$PROMPT" | sed 's|^/ai\s*||' | xargs)

          aider \
            --model flash \
            --message "$CLEAN_PROMPT" \
            --commit-prompt "Generate concise commit message in English, start with relevant emoji" \
            --yes \
            --no-show-model-warnings

          # Pastikan ada perubahan
          if git diff --quiet origin/main...HEAD; then
            echo "No changes → skip PR"
            exit 0
          fi

          git add . || true
          git commit --amend --no-edit || git commit -m "🤖 Gemini auto-fix"

          git push origin "$BRANCH" --force-with-lease

          TITLE="🤖 Gemini 2.5 Flash fix: ${CLEAN_PROMPT:0:100}..."
          TITLE=$(echo "$TITLE" | tr '\n' ' ' | xargs)

          gh pr create \
            --title "$TITLE" \
            --body "## 🤖 Auto-generated by Gemini 2.5 Flash\n\nPrompt:\n\`\`\`\n$CLEAN_PROMPT\n\`\`\`\n\nReview carefully before merging!" \
            --base main \
            --head "$BRANCH"
