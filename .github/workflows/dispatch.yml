name: Custom Slash Command Dispatch

on:
  issue_comment:
    types: [created]  # Bisa tambah 'edited' kalau mau tangkap edit comment

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Slash Command Dispatch
        uses: peter-evans/slash-command-dispatch@v5
        with:
          token: ${{ secrets.PAT }}          # PAT repo-scoped wajib!
          reaction-token: ${{ secrets.PAT }} # Optional: biar reaction dari akun kamu
          reactions: true                    # Tambah eyes + rocket reaction
          permission: write                  # Minimal permission user harus punya write access
          issue-type: pull-request           # Hanya di PR (ubah ke 'both' kalau mau di issue juga)
          commands: |
            build
            plan
            # Tambah command lain kalau mau: test, deploy, review, dll.
