<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="theme-color" content="#1C1B1F">
    <title>devBattery Monitor</title>
    <style>
        :root {
            /* Material Design 3 Colors */
            --md-sys-color-primary: #D0BCFF;
            --md-sys-color-on-primary: #381E72;
            --md-sys-color-primary-container: #4F378B;
            --md-sys-color-on-primary-container: #EADDFF;
            --md-sys-color-secondary: #CCC2DC;
            --md-sys-color-secondary-container: #4A4458;
            --md-sys-color-on-secondary-container: #E8DEF8;
            --md-sys-color-tertiary: #EFB8C8;
            --md-sys-color-tertiary-container: #633B48;
            --md-sys-color-on-tertiary-container: #FFD8E4;
            --md-sys-color-surface: #1C1B1F;
            --md-sys-color-surface-dim: #141316;
            --md-sys-color-surface-bright: #3B383E;
            --md-sys-color-surface-container: #211F26;
            --md-sys-color-surface-container-high: #2B2930;
            --md-sys-color-surface-container-highest: #36343B;
            --md-sys-color-on-surface: #E6E0E9;
            --md-sys-color-on-surface-variant: #CAC4D0;
            --md-sys-color-outline: #938F99;
            --md-sys-color-outline-variant: #49454F;
            --md-sys-color-error: #F2B8B5;
            --md-sys-color-on-error: #601410;
            --md-sys-color-error-container: #8C1D18;
            
            /* Motion */
            --md-motion-emphasized: cubic-bezier(0.2, 0, 0, 1);
            --md-motion-emphasized-decel: cubic-bezier(0.05, 0.7, 0.1, 1);
            --md-motion-emphasized-accel: cubic-bezier(0.3, 0, 0.8, 0.15);
            --md-motion-standard: cubic-bezier(0.2, 0, 0, 1);
            --md-motion-spring: cubic-bezier(0.5, 1.5, 0.5, 1);
        }
        
        @keyframes bubbleRise {
            0% {
                transform: translate3d(0, 0, 0) scale(0.8);
                opacity: 0;
            }
            5% {
                opacity: 0.4;
                transform: translate3d(calc(var(--curve-amplitude) * 0.2), calc(var(--rise-distance) * 0.05), 0) scale(0.9);
            }
            15% {
                opacity: 0.8;
                transform: translate3d(calc(var(--curve-amplitude) * 0.6), calc(var(--rise-distance) * 0.15), 0) scale(1);
            }
            25% {
                opacity: 1;
                transform: translate3d(calc(var(--curve-amplitude) * 0.95), calc(var(--rise-distance) * 0.25), 0) scale(1);
            }
            35% {
                opacity: 1;
                transform: translate3d(calc(var(--curve-amplitude) * 0.8), calc(var(--rise-distance) * 0.35), 0) scale(1);
            }
            45% {
                opacity: 0.95;
                transform: translate3d(calc(var(--curve-amplitude) * 0.4), calc(var(--rise-distance) * 0.45), 0) scale(0.95);
            }
            55% {
                opacity: 0.9;
                transform: translate3d(calc(var(--curve-amplitude) * -0.1), calc(var(--rise-distance) * 0.55), 0) scale(0.9);
            }
            65% {
                opacity: 0.8;
                transform: translate3d(calc(var(--curve-amplitude) * -0.5), calc(var(--rise-distance) * 0.65), 0) scale(0.85);
            }
            75% {
                opacity: 0.6;
                transform: translate3d(calc(var(--curve-amplitude) * -0.7), calc(var(--rise-distance) * 0.75), 0) scale(0.8);
            }
            85% {
                opacity: 0.3;
                transform: translate3d(calc(var(--curve-amplitude) * -0.5), calc(var(--rise-distance) * 0.85), 0) scale(0.7);
            }
            95% {
                opacity: 0.1;
                transform: translate3d(calc(var(--curve-amplitude) * -0.2), calc(var(--rise-distance) * 0.95), 0) scale(0.6);
            }
            100% {
                transform: translate3d(0, var(--rise-distance), 0) scale(0.5);
                opacity: 0;
            }
        }
        
        @keyframes dropletFall {
            0% {
                transform: translate3d(0, 0, 0) translateZ(0);
                opacity: 0.95;
            }
            100% {
                transform: translate3d(0, var(--fall-distance), 0) translateZ(0);
                opacity: 0;
            }
        }
        
        @keyframes splashParticle {
            0% { transform: translate3d(0, 0, 0) scale(1); opacity: 1; }
            25% { transform: translate3d(var(--splash-x), -8px, 0) scale(1.2); opacity: 0.9; }
            60% { transform: translate3d(calc(var(--splash-x) * 1.8), 2px, 0) scale(0.8); opacity: 0.6; }
            100% { transform: translate3d(calc(var(--splash-x) * 2.2), 12px, 0) scale(0.3); opacity: 0; }
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(32px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        @keyframes scaleIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes slideInBottom {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes valueChange {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px 16px;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
        }
        
        .drain-leak-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }
        
        .app-header {
            margin-bottom: 32px;
            padding: 4px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeInUp 0.6s var(--md-motion-emphasized-decel);
        }
        
        .header-left { flex: 1; }
        
        .app-title {
            font-size: 27px;
            font-weight: 600;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, var(--md-sys-color-on-surface) 0%, var(--md-sys-color-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .app-subtitle {
            font-size: 14px;
            color: var(--md-sys-color-on-surface-variant);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s var(--md-motion-emphasized);
        }
        
        .app-subtitle:active {
            color: var(--md-sys-color-primary);
            transform: scale(0.95);
        }
        
        .telegram-icon {
            width: 18px;
            height: 18px;
        }
        
        .root-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.4s var(--md-motion-spring);
            animation: scaleIn 0.5s var(--md-motion-emphasized-decel) 0.2s both;
            user-select: none;
            background: var(--md-sys-color-surface-container-high);
            color: var(--md-sys-color-on-surface-variant);
        }
        
        .root-badge:active { transform: scale(0.92); }
        .root-icon { font-size: 16px; }
        
        .tiles-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .tile {
            background: var(--md-sys-color-surface-container-high);
            border-radius: 24px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s var(--md-motion-emphasized);
            animation: scaleIn 0.5s var(--md-motion-emphasized-decel);
        }
        
        .tile::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: radial-gradient(circle, var(--md-sys-color-primary) 0%, transparent 70%);
            opacity: 0;
            transform: translate(-50%, -50%);
            transition: all 0.5s var(--md-motion-emphasized);
        }
        
        .tile:active::before {
            width: 200%;
            height: 200%;
            opacity: 0.15;
        }
        
        .tile:active {
            transform: scale(0.95);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        
        .tile:nth-child(1) { animation-delay: 0ms; }
        .tile:nth-child(2) { animation-delay: 80ms; }
        .tile:nth-child(3) { animation-delay: 160ms; }
        .tile:nth-child(4) { animation-delay: 240ms; }
        .tile:nth-child(5) { animation-delay: 320ms; }
        .tile:nth-child(6) { animation-delay: 400ms; }
        
        .tile-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--md-sys-color-on-surface-variant);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 12px;
            opacity: 0.8;
            position: relative;
            z-index: 10;
        }
        
        .tile-value-wrapper {
            display: flex;
            align-items: baseline;
            gap: 4px;
            position: relative;
            z-index: 10;
        }
        
        .tile-value {
            font-size: 36px;
            font-weight: 400;
            color: var(--md-sys-color-on-surface);
            line-height: 1;
            font-variant-numeric: tabular-nums;
            transition: all 0.3s var(--md-motion-spring);
        }
        
        .tile-value.updating {
            animation: valueChange 0.4s var(--md-motion-spring);
        }
        
        .tile-unit {
            font-size: 18px;
            font-weight: 400;
            color: var(--md-sys-color-on-surface-variant);
            opacity: 0.7;
        }
        
        .tile-large {
            grid-column: span 2;
            background: var(--md-sys-color-surface-container-high);
            padding: 28px;
            min-height: 200px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        
        .tile-large .tile-label {
            font-size: 18px;
            color: #FFFFFF;
            opacity: 0.9;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }
        
        .tile-large .tile-value {
            font-size: 72px;
            color: #FFFFFF;
            font-weight: 300;
            letter-spacing: -3px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }
        
        .tile-large .tile-unit {
            font-size: 32px;
            color: #FFFFFF;
            opacity: 0.8;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }
        
        .liquid-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 24px;
            pointer-events: none;
            z-index: 1;
        }
        
        .liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            transition: height 0.8s cubic-bezier(0.4, 0.0, 0.2, 1), background 0.5s ease;
            transform-origin: center bottom;
        }
        
        .bubble {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 10px;
            height: 10px;
            opacity: 0;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0.4) 50%, rgba(255, 255, 255, 0.1) 100%);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 2px rgba(255, 255, 255, 0.2);
            animation: bubbleRise linear forwards;
            will-change: transform, opacity;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            contain: layout style paint;
        }
        
        .drain-drip {
            position: fixed;
            width: 10px;
            height: 14px;
            background: var(--drain-color);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            clip-path: polygon(50% 0%, 100% 40%, 85% 100%, 50% 85%, 15% 100%, 0% 40%);
            pointer-events: none;
            z-index: 999;
            opacity: 0.9;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
            transform: translateZ(0);
            backface-visibility: hidden;
            will-change: transform, opacity;
            contain: layout style paint;
        }
        
        .splash-particle {
            position: fixed;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--splash-color);
            animation: splashParticle 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            pointer-events: none;
            z-index: 998;
            transform: translateZ(0);
            backface-visibility: hidden;
        }
        
        .status-text {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.4s var(--md-motion-spring);
            animation: slideInBottom 0.6s var(--md-motion-emphasized-decel) 0.3s both;
            z-index: 10;
            color: #FFFFFF;
            opacity: 0.9;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }
        
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 24px;
            animation: fadeInUp 0.7s var(--md-motion-emphasized) 0.5s both;
        }
        
        .md-button {
            width: 100%;
            height: 56px;
            border: none;
            border-radius: 28px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.2px;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s var(--md-motion-emphasized);
        }
        
        .md-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: currentColor;
            opacity: 0;
            transform: translate(-50%, -50%);
            transition: all 0.6s var(--md-motion-emphasized);
        }
        
        .md-button:active::before {
            width: 300%;
            height: 300%;
            opacity: 0.2;
        }
        
        .md-button:active { transform: scale(0.94); }
        
        .md-button-filled {
            background: linear-gradient(135deg, var(--md-sys-color-primary) 0%, var(--md-sys-color-tertiary) 100%);
            color: var(--md-sys-color-on-primary);
            box-shadow: 0 6px 20px rgba(208, 188, 255, 0.4);
        }
        
        .md-button-filled:active {
            box-shadow: 0 12px 32px rgba(208, 188, 255, 0.6);
        }
        
        .md-button-outlined {
            background: transparent;
            color: var(--md-sys-color-primary);
            border: 2px solid var(--md-sys-color-outline);
        }
        
        .md-button-outlined:active {
            background: rgba(208, 188, 255, 0.12);
            border-color: var(--md-sys-color-primary);
        }
        
        .icon {
            font-style: normal;
            font-size: 22px;
            transition: transform 0.3s var(--md-motion-spring);
        }
        
        .md-button:active .icon { transform: scale(1.2) rotate(10deg); }
        
        .debug-card {
            margin-top: 24px;
            background: var(--md-sys-color-surface-container);
            border-radius: 24px;
            padding: 24px;
            display: none;
            max-height: 500px;
            overflow-y: auto;
            animation: fadeInUp 0.5s var(--md-motion-emphasized);
            border: 1px solid var(--md-sys-color-outline-variant);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        
        .debug-card.show { display: block; }
        
        .debug-card pre {
            font-family: 'Roboto Mono', 'SF Mono', monospace;
            font-size: 10px;
            line-height: 1.6;
            color: var(--md-sys-color-on-surface-variant);
            white-space: pre-wrap;
            word-break: break-all;
        }
        

        
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--md-sys-color-outline-variant);
            border-radius: 5px;
            transition: background 0.3s;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--md-sys-color-outline); }
    </style>
</head>
<body>
    <div class="drain-leak-overlay" id="drain-leak-overlay"></div>
    
    <div class="container">
        <header class="app-header">
            <div class="header-left">
                <h1 class="app-title">devBattery Monitor</h1>
                <a href="https://t.me/hoshiyomi_id" class="app-subtitle">
                    <svg class="telegram-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 0 0-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
                    </svg>
                    <span>t.me/hoshiyomi_id</span>
                </a>
            </div>
        </header>
        
        <div class="tiles-grid">
            <div class="tile tile-large" id="tile-capacity">
                <div class="liquid-container" id="liquid-container">
                    <div class="liquid" id="liquid"></div>
                </div>
                
                <div class="tile-label">Battery</div>
                <div class="tile-value-wrapper">
                    <span class="tile-value" id="capacity-value">--</span>
                    <span class="tile-unit">%</span>
                </div>
                <div class="status-text" id="status-text">
                    <span id="status-label">--</span>
                </div>
            </div>
            
            <div class="tile" id="tile-current">
                <div class="tile-label">Current</div>
                <div class="tile-value-wrapper">
                    <span class="tile-value" id="current-value">--</span>
                    <span class="tile-unit">mA</span>
                </div>
            </div>
            
            <div class="tile" id="tile-power">
                <div class="tile-label">Power</div>
                <div class="tile-value-wrapper">
                    <span class="tile-value" id="power-value">--</span>
                    <span class="tile-unit">W</span>
                </div>
            </div>
            
            <div class="tile" id="tile-voltage">
                <div class="tile-label">Voltage</div>
                <div class="tile-value-wrapper">
                    <span class="tile-value" id="voltage-value">--</span>
                    <span class="tile-unit">V</span>
                </div>
            </div>
            
            <div class="tile" id="tile-temp">
                <div class="tile-label">Temperature</div>
                <div class="tile-value-wrapper">
                    <span class="tile-value" id="temp-value">--</span>
                    <span class="tile-unit">°C</span>
                </div>
            </div>
        </div>
        
        <div class="action-buttons">
            <button class="md-button md-button-filled" onclick="showDebug()">
                <span class="icon">🔍</span>
                <span>Show Debug Info</span>
            </button>
            <button class="md-button md-button-outlined" onclick="copyDebug()">
                <span class="icon">📋</span>
                <span>Copy to Clipboard</span>
            </button>
            <button class="md-button md-button-filled" id="bubble-toggle-btn" onclick="toggleBubbleSimulation()">
                <span class="icon">🫧</span>
                <span id="bubble-btn-text">Bubbles: Off</span>
            </button>
        </div>
        
        <div class="debug-card" id="debug-card">
            <pre id="debug-output"></pre>
        </div>
    </div>

    <script>
        let debugData = '';
        let hasRoot = false;
        let previousValues = {};
        let isCharging = false;
        let bubbleSpawnInterval = null;
        // Track current ma (for spawn logic)
        let currentMA = 0; // mA
        let bubbleCount = 0;
        let lastStatus = '';
        let currentCapacity = 0;
        let currentTheme = 'dark';
        let drainLeakTimeout = null;
        let activeDrainLeaks = 0;
        const MAX_DRAIN_LEAKS = 3;
        const MIN_INTERVAL = 5000;
        const MAX_INTERVAL = 10000;
        const DROPLET_DURATION = 1100;
        const SPLASH_TIMING = 1045;
        const LANDING_OFFSET = 15;
        const containerHeight = 200;
        // Simplified bubble settings - no dynamic performance adjustment
        const MAX_BUBBLES = 12; // Fixed limit for smooth performance
        
        // Manual bubble simulation toggle state
        let isBubbleSimulationEnabled = false;
        
        function applyTheme(theme) {
            currentTheme = theme;
            const root = document.documentElement;
            
            if (theme === 'light') {
                root.style.setProperty('--md-sys-color-primary', '#6750A4');
                root.style.setProperty('--md-sys-color-surface', '#FFFBFE');
                root.style.setProperty('--md-sys-color-on-surface', '#1C1B1F');
                document.querySelector('meta[name="theme-color"]').setAttribute('content', '#FFFBFE');
            } else {
                root.style.setProperty('--md-sys-color-primary', '#D0BCFF');
                root.style.setProperty('--md-sys-color-surface', '#1C1B1F');
                root.style.setProperty('--md-sys-color-on-surface', '#E6E0E9');
                document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1C1B1F');
            }
        }
        
        try {
            if (typeof Android !== 'undefined' && Android.getSystemTheme) {
                applyTheme(Android.getSystemTheme());
            } else {
                applyTheme('dark');
            }
        } catch (e) {
            applyTheme('dark');
        }
        
        function formatPower(value) {
            const num = parseFloat(value);
            if (isNaN(num)) return value;
            return Math.min(99.9, num).toFixed(2).replace(/\.00$/, '');
        }
        
        function formatNumber(value, decimals = 1) {
            const num = parseFloat(value);
            if (isNaN(num)) return value;
            return Math.min(99.9, num).toFixed(decimals).replace(/\.0$/, '');
        }
        
        function calculateLandingPosition() {
            const tile = document.getElementById('tile-capacity');
            const rect = tile.getBoundingClientRect();
            const viewportHeight = window.innerHeight;
            const landingY = viewportHeight - LANDING_OFFSET;
            const spawnY = rect.bottom - 10; // Adjust spawn position
            const fallDistance = Math.max(50, landingY - spawnY); // Ensure minimum fall distance
            
            return {
                spawnX: rect.right - 20,
                spawnY: spawnY,
                landingY: landingY,
                landingX: rect.right - 20,
                fallDistance: fallDistance
            };
        }
        
        // Compute bubbles to spawn based on current MA (simulating heating)
        function computeBubbleSpawn(current_now_ma, currently) {
            // If manual simulation is enabled, spawn bubbles regardless of current
            if (isBubbleSimulationEnabled) {
                // More randomized spawn count for natural timing
                const spawnCount = Math.random() < 0.7 ? 1 : (Math.random() < 0.9 ? 2 : 0);
                const availableSlots = MAX_BUBBLES - currently;
                return Math.min(spawnCount, availableSlots);
            }
            
            // If discharging, stop spawning bubbles
            if (current_now_ma <= 0) {
                return 0;
            }
            
            // If charging, spawn bubbles based on current intensity (reduced for performance)
            // 1 bubble per 800mA (less frequent spawning) with randomization
            const baseSpawnCount = Math.floor(current_now_ma / 800);
            const spawnCount = baseSpawnCount > 0 ? (baseSpawnCount + (Math.random() < 0.3 ? 1 : 0)) : 0;
            
            // Ensure we don't exceed max bubbles
            const availableSlots = MAX_BUBBLES - currently;
            return Math.min(spawnCount, availableSlots);
        }

        function spawnRandomBubble() {
            const container = document.getElementById('liquid-container');
            const liquid = document.getElementById('liquid');
            const toSpawn = Math.max(0, computeBubbleSpawn(currentMA, bubbleCount));
            
            // Simple bubble count limit - no performance modes
            if (bubbleCount >= MAX_BUBBLES) return;
            
            const containerHeight = container.offsetHeight;
            const containerWidth = container.offsetWidth;
            const liquidHeightPx = liquid.offsetHeight;
            if (liquidHeightPx <= 0) return;
            
            const riseDistance = liquidHeightPx - 2; // Bubbles fade 2px below liquid surface
            
            for (let i = 0; i < toSpawn; i++) {
                if (bubbleCount >= MAX_BUBBLES) break;
                
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                
                // 3 distinct bubble sizes with pronounced differences
                const sizeCategory = Math.random();
                let size, speedMultiplier, curveMultiplier;
                
                if (sizeCategory < 0.33) {
                    // Small bubbles (33% chance)
                    size = 4 + Math.random() * 2; // 4-6px
                    speedMultiplier = 0.5; // Rise 50% faster
                    curveMultiplier = 0.4; // Minimal curve
                } else if (sizeCategory < 0.67) {
                    // Medium bubbles (33% chance)
                    size = 7 + Math.random() * 3; // 7-9px
                    speedMultiplier = 0.8; // Rise 20% faster
                    curveMultiplier = 0.8; // Moderate curve
                } else {
                    // Large bubbles (34% chance)
                    size = 10 + Math.random() * 4; // 10-14px
                    speedMultiplier = 1.3; // Rise 30% slower
                    curveMultiplier = 1.8; // Maximum curve
                }
                
                const left = Math.random() * 80 + 10; // Better distribution across container
                
                const heightRatio = liquidHeightPx / containerHeight;
                // Rise duration optimized for performance
                const baseDuration = 2.2; // Reduced base duration
                const duration = baseDuration * speedMultiplier * (0.8 + Math.random() * 0.1);
                const finalDuration = Math.max(1.0, Math.min(3.5, duration));
                
                // Simplified curve calculation for better performance
                const baseCurve = 6; // Reduced curve amplitude
                const curveVariation = 0.5 + Math.random() * 0.5;
                const curveAmplitude = baseCurve * curveMultiplier * curveVariation;
                
                bubble.style.width = size + 'px';
                bubble.style.height = size + 'px';
                bubble.style.left = left + '%';
                bubble.style.bottom = '0';
                bubble.style.setProperty('--rise-distance', -riseDistance + 'px');
                bubble.style.setProperty('--curve-amplitude', curveAmplitude + 'px');
                bubble.style.animationDuration = finalDuration + 's';
                const animationDelay = Math.random() * 1.2 + 0.2; // Random delay 0.2-1.4s for better spacing
                bubble.style.animationDelay = animationDelay + 's';
                
                // Ensure bubble has proper initial state
                bubble.style.opacity = '0';
                bubble.style.willChange = 'transform, opacity';
                
                container.appendChild(bubble);
                bubbleCount++;
                
                // Start the animation after a brief delay to ensure proper initialization
                requestAnimationFrame(() => {
                    bubble.style.opacity = '';
                });
                
                // Precise bubble cleanup - match animation duration exactly to prevent premature disappearing
                const totalAnimationTime = (finalDuration + animationDelay) * 1000;
                setTimeout(() => {
                    if (bubble && bubble.parentNode === container) {
                        container.removeChild(bubble);
                        bubbleCount = Math.max(0, bubbleCount - 1);
                    }
                }, totalAnimationTime + 100); // Add 100ms buffer to ensure animation completes
            }
        }
        

        
        function toggleBubbleSpawning(active) {
            if (active && !bubbleSpawnInterval) {
                bubbleSpawnInterval = setInterval(() => {
                    spawnRandomBubble();
                }, 600); // Consistent interval for natural timing
            } else if (!active && bubbleSpawnInterval) {
                clearInterval(bubbleSpawnInterval);
                bubbleSpawnInterval = null;
                document.querySelectorAll('.bubble').forEach(b => b.remove());
                bubbleCount = 0;
            }
        }
        
        function spawnSplash(landingY, landingX) {
            const splashColor = getBatteryColor(currentCapacity);
            const particleCount = 6 + Math.floor(Math.random() * 4);
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'splash-particle';
                particle.style.top = landingY + 'px';
                particle.style.left = landingX + 'px';
                
                const direction = (Math.random() - 0.5) * 2;
                const distance = (20 + Math.random() * 25) * Math.sign(direction || 1);
                
                particle.style.setProperty('--splash-x', distance + 'px');
                particle.style.setProperty('--splash-color', splashColor);
                particle.style.animationDelay = (Math.random() * 0.05) + 's';
                
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 500);
            }
        }
        
        function spawnDrainDrip() {
            if (activeDrainLeaks >= MAX_DRAIN_LEAKS) return;
            
            const overlay = document.getElementById('drain-leak-overlay');
            const drip = document.createElement('div');
            drip.className = 'drain-drip';
            
            const pos = calculateLandingPosition();
            
            // Set positioning and animation properties
            drip.style.top = pos.spawnY + 'px';
            drip.style.left = pos.spawnX + 'px';
            drip.style.setProperty('--fall-distance', pos.fallDistance + 'px');
            drip.style.setProperty('--drain-color', getBatteryColor(currentCapacity));
            
            // Ensure the droplet is visible and properly positioned
            drip.style.opacity = '0.9';
            drip.style.position = 'fixed';
            drip.style.zIndex = '999';
            
            // Debug: ensure fall distance is valid
            if (pos.fallDistance <= 0) {
                console.warn('Invalid fall distance calculated:', pos.fallDistance);
                return;
            }
            
            overlay.appendChild(drip);
            activeDrainLeaks++;
            
            // Set will-change before animation for GPU optimization
            drip.style.willChange = 'transform, opacity';
            
            // Start animation with linear timing for smooth constant-speed fall
            drip.style.animation = 'dropletFall 0.5s cubic-bezier(0.4, 0, 1, 1) forwards';

            // Create splash effect at 84% of animation (synced with simplified keyframes)
            const splashTimeout = setTimeout(() => {
                spawnSplash(pos.landingY, pos.landingX);
            }, 420);
            
            // Clean up droplet using animationend event for precise timing
            drip.addEventListener('animationend', () => {
                clearTimeout(splashTimeout);
                if (drip && drip.parentNode === overlay) {
                    drip.remove();
                    activeDrainLeaks--;
                }
            }, { once: true });
        }
        
        function scheduleNextDrip() {
            if (!drainLeakTimeout) return;
            
            const nextInterval = Math.floor(Math.random() * (MAX_INTERVAL - MIN_INTERVAL + 1)) + MIN_INTERVAL;
            drainLeakTimeout = setTimeout(() => {
                spawnDrainDrip();
                scheduleNextDrip();
            }, nextInterval);
        }
        
        function toggleDrainLeak(active) {
            if (active && !drainLeakTimeout) {
                drainLeakTimeout = true;
                setTimeout(() => {
                    if (!drainLeakTimeout) return;
                    spawnDrainDrip();
                    scheduleNextDrip();
                }, 3000);
            } else if (!active && drainLeakTimeout) {
                clearTimeout(drainLeakTimeout);
                drainLeakTimeout = null;
                document.querySelectorAll('.drain-drip, .splash-particle').forEach(el => el.remove());
                activeDrainLeaks = 0;
            }
        }
        
        function getBatteryColor(percentage) {
            const stages = [
                { percent: 0, color: [211, 47, 47] },
                { percent: 10, color: [211, 47, 47] },
                { percent: 10, color: [244, 67, 54] },
                { percent: 20, color: [244, 67, 54] },
                { percent: 20, color: [255, 87, 34] },
                { percent: 30, color: [255, 87, 34] },
                { percent: 30, color: [255, 152, 0] },
                { percent: 40, color: [255, 152, 0] },
                { percent: 40, color: [255, 193, 7] },
                { percent: 50, color: [255, 193, 7] },
                { percent: 50, color: [255, 235, 59] },
                { percent: 60, color: [255, 235, 59] },
                { percent: 60, color: [205, 220, 57] },
                { percent: 70, color: [205, 220, 57] },
                { percent: 70, color: [139, 195, 74] },
                { percent: 80, color: [139, 195, 74] },
                { percent: 80, color: [102, 187, 106] },
                { percent: 90, color: [102, 187, 106] },
                { percent: 90, color: [76, 175, 80] },
                { percent: 100, color: [76, 175, 80] }
            ];
            
            let lowerStage = stages[0];
            let upperStage = stages[stages.length - 1];
            
            for (let i = 0; i < stages.length - 1; i++) {
                if (percentage >= stages[i].percent && percentage <= stages[i + 1].percent) {
                    lowerStage = stages[i];
                    upperStage = stages[i + 1];
                    break;
                }
            }
            
            const range = upperStage.percent - lowerStage.percent;
            let ratio = 0;
            
            if (range > 0) {
                ratio = (percentage - lowerStage.percent) / range;
            }
            
            const r = Math.floor(lowerStage.color[0] + (upperStage.color[0] - lowerStage.color[0]) * ratio);
            const g = Math.floor(lowerStage.color[1] + (upperStage.color[1] - lowerStage.color[1]) * ratio);
            const b = Math.floor(lowerStage.color[2] + (upperStage.color[2] - lowerStage.color[2]) * ratio);
            
            return `rgba(${r}, ${g}, ${b}, 0.9)`;
        }
        
        function updateLiquid(percentage) {
            const liquid = document.getElementById('liquid');
            currentCapacity = percentage;
            liquid.style.height = percentage + '%';
            
            const color = getBatteryColor(percentage);
            liquid.style.background = `linear-gradient(180deg, 
                ${getBatteryColor(Math.min(100, percentage + 8))} 0%, 
                ${getBatteryColor(Math.min(100, percentage + 4))} 50%, 
                ${color} 100%)`;
            
            // New bubbles will get the current liquid level as their target.
            // Existing bubbles will continue their path to the level they were spawned for,
            // avoiding visual inconsistencies from mid-animation target changes.
        }
        
        function animateValue(elementId, newValue) {
            const element = document.getElementById(elementId);
            if (previousValues[elementId] !== newValue) {
                element.classList.add('updating');
                setTimeout(() => element.classList.remove('updating'), 400);
            }
            element.textContent = newValue;
            previousValues[elementId] = newValue;
        }
        
        function updateBattery() {
            try {
                const data = JSON.parse(Android.getBatteryData());
                if (data.error) {
                    return;
                }
                
                const capacity = parseInt(data.capacity) || 0;
                const status = data.status || lastStatus || "Unknown";
                
                // VOLTAGE: Backend now sends mV (already converted from sysfs uV, or fallback 1000mV)
                // Just divide by 1000 to get volts for display
                const voltageRaw = parseInt(data.voltage) || 1000; // Fallback to 1V if missing
                const voltage = formatNumber(voltageRaw / 1000, 2);
                
                const current = Math.floor((parseInt(data.current_now) || 0) / 1000);
                // Update global current MA for spawn logic
                currentMA = current;
                const temperature = formatNumber((parseInt(data.temp) || 0) / 10, 1);
                
                // Power calc: backend voltage (mV) * current (uA) / 1,000,000 = milliwatts, then /1000 = watts
                const power = formatPower(Math.abs((voltageRaw * (parseInt(data.current_now) || 0)) / 1000000000));
                
                if (status !== "Unknown") lastStatus = status;
                
                animateValue('capacity-value', capacity);
                document.getElementById('status-label').textContent = lastStatus;
                animateValue('voltage-value', voltage);
                animateValue('current-value', current);
                animateValue('power-value', power);
                animateValue('temp-value', temperature);
                
                updateLiquid(capacity);
                
                const chargingActive = lastStatus.toLowerCase() === 'charging';
                
                // Logic: If manual toggle is ON, use that. If OFF, use battery status.
                if (isBubbleSimulationEnabled) {
                    toggleBubbleSpawning(true);
                } else {
                    toggleBubbleSpawning(chargingActive);
                }
                
                // Update isCharging for other logic that depends on it
                isCharging = isBubbleSimulationEnabled || chargingActive;
                
                const isDraining = lastStatus.toLowerCase() === 'discharging' || lastStatus.toLowerCase() === 'not charging';
                toggleDrainLeak(isDraining);
            } catch (e) {
            }
        }
        
        
        function showDebug() {
            try {
                debugData = Android.getDebugInfo();
                document.getElementById('debug-output').textContent = debugData;
                document.getElementById('debug-card').classList.add('show');
            } catch (e) {
            }
        }
        
        function copyDebug() {
            if (!debugData) showDebug();
            
            const textarea = document.createElement('textarea');
            textarea.value = debugData;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
            } catch (e) {
            }
            
            document.body.removeChild(textarea);
        }
        
        function toggleBubbleSimulation() {
            isBubbleSimulationEnabled = !isBubbleSimulationEnabled;
            const btnText = document.getElementById('bubble-btn-text');
            
            if (isBubbleSimulationEnabled) {
                btnText.textContent = "Bubbles: On";
                toggleBubbleSpawning(true);
            } else {
                btnText.textContent = "Bubbles: Off";
                toggleBubbleSpawning(false);
            }
        }
        
        setTimeout(() => {
            updateBattery();
        }, 300);
        
        setInterval(updateBattery, 1000);
    </script>
