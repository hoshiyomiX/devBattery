<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="theme-color" content="#1C1B1F">
    <title>devBattery Monitor</title>
    <style>
        :root {
            /* Material Design 3 Colors */
            --md-sys-color-primary: #D0BCFF;
            --md-sys-color-on-primary: #381E72;
            --md-sys-color-primary-container: #4F378B;
            --md-sys-color-on-primary-container: #EADDFF;
            --md-sys-color-secondary: #CCC2DC;
            --md-sys-color-secondary-container: #4A4458;
            --md-sys-color-on-secondary-container: #E8DEF8;
            --md-sys-color-tertiary: #EFB8C8;
            --md-sys-color-tertiary-container: #633B48;
            --md-sys-color-on-tertiary-container: #FFD8E4;
            --md-sys-color-surface: #1C1B1F;
            --md-sys-color-surface-dim: #141316;
            --md-sys-color-surface-bright: #3B383E;
            --md-sys-color-surface-container: #211F26;
            --md-sys-color-surface-container-high: #2B2930;
            --md-sys-color-surface-container-highest: #36343B;
            --md-sys-color-on-surface: #E6E0E9;
            --md-sys-color-on-surface-variant: #CAC4D0;
            --md-sys-color-outline: #938F99;
            --md-sys-color-outline-variant: #49454F;
            --md-sys-color-error: #F2B8B5;
            --md-sys-color-on-error: #601410;
            --md-sys-color-error-container: #8C1D18;
            
            /* Motion */
            --md-motion-emphasized: cubic-bezier(0.2, 0, 0, 1);
            --md-motion-emphasized-decel: cubic-bezier(0.05, 0.7, 0.1, 1);
            --md-motion-emphasized-accel: cubic-bezier(0.3, 0, 0.8, 0.15);
            --md-motion-standard: cubic-bezier(0.2, 0, 0, 1);
            --md-motion-spring: cubic-bezier(0.5, 1.5, 0.5, 1);
        }
        
        @keyframes bubbleRise {
            0% {
                transform: translateY(0) translateX(0) scale(0);
                opacity: 0;
            }
            5% {
                opacity: 1;
                transform: translateY(-10px) translateX(0) scale(1);
            }
            50% { opacity: 0.8; }
            95% { opacity: 0.3; }
            100% {
                transform: translateY(var(--rise-distance, -180px)) translateX(var(--drift-x, 0)) scale(0.8);
                opacity: 0;
            }
        }
        
        @keyframes dropletFall {
            0% { transform: translateY(0); opacity: 0; }
            5% { opacity: 0.95; }
            100% {
                transform: translateY(var(--fall-distance));
                opacity: 0;
            }
        }
        
        @keyframes splashParticle {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            15% { transform: translate(var(--splash-x), -8px) scale(1.2); opacity: 0.9; }
            50% { transform: translate(calc(var(--splash-x) * 1.8), 2px) scale(0.8); opacity: 0.6; }
            100% { transform: translate(calc(var(--splash-x) * 2.2), 12px) scale(0.3); opacity: 0; }
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(32px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        @keyframes scaleIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes slideInBottom {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes valueChange {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px 16px;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
        }
        
        .drain-leak-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }
        
        .app-header {
            margin-bottom: 32px;
            padding: 4px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeInUp 0.6s var(--md-motion-emphasized-decel);
        }
        
        .header-left { flex: 1; }
        
        .app-title {
            font-size: 27px;
            font-weight: 600;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, var(--md-sys-color-on-surface) 0%, var(--md-sys-color-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .app-subtitle {
            font-size: 14px;
            color: var(--md-sys-color-on-surface-variant);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s var(--md-motion-emphasized);
        }
        
        .app-subtitle:active {
            color: var(--md-sys-color-primary);
            transform: scale(0.95);
        }
        
        .telegram-icon {
            width: 18px;
            height: 18px;
        }
        
        .root-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.4s var(--md-motion-spring);
            animation: scaleIn 0.5s var(--md-motion-emphasized-decel) 0.2s both;
            user-select: none;
            background: var(--md-sys-color-surface-container-high);
            color: var(--md-sys-color-on-surface-variant);
        }
        
        .root-badge:active { transform: scale(0.92); }
        .root-icon { font-size: 16px; }
        
        .tiles-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .tile {
            background: var(--md-sys-color-surface-container-high);
            border-radius: 24px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s var(--md-motion-emphasized);
            animation: scaleIn 0.5s var(--md-motion-emphasized-decel);
        }
        
        .tile::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: radial-gradient(circle, var(--md-sys-color-primary) 0%, transparent 70%);
            opacity: 0;
            transform: translate(-50%, -50%);
            transition: all 0.5s var(--md-motion-emphasized);
        }
        
        .tile:active::before {
            width: 200%;
            height: 200%;
            opacity: 0.15;
        }
        
        .tile:active {
            transform: scale(0.95);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        
        .tile:nth-child(1) { animation-delay: 0ms; }
        .tile:nth-child(2) { animation-delay: 80ms; }
        .tile:nth-child(3) { animation-delay: 160ms; }
        .tile:nth-child(4) { animation-delay: 240ms; }
        .tile:nth-child(5) { animation-delay: 320ms; }
        .tile:nth-child(6) { animation-delay: 400ms; }
        
        .tile-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--md-sys-color-on-surface-variant);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 12px;
            opacity: 0.8;
            position: relative;
            z-index: 10;
        }
        
        .tile-value-wrapper {
            display: flex;
            align-items: baseline;
            gap: 4px;
            position: relative;
            z-index: 10;
        }
        
        .tile-value {
            font-size: 36px;
            font-weight: 400;
            color: var(--md-sys-color-on-surface);
            line-height: 1;
            font-variant-numeric: tabular-nums;
            transition: all 0.3s var(--md-motion-spring);
        }
        
        .tile-value.updating {
            animation: valueChange 0.4s var(--md-motion-spring);
        }
        
        .tile-unit {
            font-size: 18px;
            font-weight: 400;
            color: var(--md-sys-color-on-surface-variant);
            opacity: 0.7;
        }
        
        .tile-large {
            grid-column: span 2;
            background: linear-gradient(135deg, var(--md-sys-color-primary-container) 0%, var(--md-sys-color-tertiary-container) 100%);
            padding: 28px;
            min-height: 200px;
            box-shadow: 0 8px 24px rgba(79, 55, 139, 0.4);
        }
        
        .tile-large .tile-label {
            font-size: 18px;
            color: var(--md-sys-color-on-primary-container);
            opacity: 0.9;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .tile-large .tile-value {
            font-size: 72px;
            color: var(--md-sys-color-on-primary-container);
            font-weight: 300;
            letter-spacing: -3px;
        }
        
        .tile-large .tile-unit {
            font-size: 32px;
            color: var(--md-sys-color-on-primary-container);
            opacity: 0.8;
        }
        
        .liquid-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 24px;
            pointer-events: none;
            z-index: 1;
        }
        
        .liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            transition: height 0.8s cubic-bezier(0.4, 0.0, 0.2, 1), background 0.5s ease;
            transform-origin: center bottom;
        }
        
        .bubble {
            position: absolute;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.4) 100%);
            border-radius: 50%;
            animation: bubbleRise 3s ease-out forwards;
            pointer-events: none;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.6), inset 0 0 4px rgba(255, 255, 255, 0.8);
        }
        
        .drain-drip {
            position: fixed;
            width: 8px;
            height: 12px;
            background: var(--drain-color);
            border-radius: 50% 50% 50% 0%;
            transform: rotate(45deg);
            animation: dropletFall 1.1s cubic-bezier(0.5, 0, 1, 1) forwards;
            pointer-events: none;
            z-index: 999;
            opacity: 0.9;
        }
        
        .splash-particle {
            position: fixed;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--splash-color);
            animation: splashParticle 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            pointer-events: none;
            z-index: 998;
        }
        
        .status-text {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.4s var(--md-motion-spring);
            animation: slideInBottom 0.6s var(--md-motion-emphasized-decel) 0.3s both;
            z-index: 10;
            color: var(--md-sys-color-on-primary-container);
            opacity: 0.9;
        }
        
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 24px;
            animation: fadeInUp 0.7s var(--md-motion-emphasized) 0.5s both;
        }
        
        .md-button {
            width: 100%;
            height: 56px;
            border: none;
            border-radius: 28px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.2px;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s var(--md-motion-emphasized);
        }
        
        .md-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: currentColor;
            opacity: 0;
            transform: translate(-50%, -50%);
            transition: all 0.6s var(--md-motion-emphasized);
        }
        
        .md-button:active::before {
            width: 300%;
            height: 300%;
            opacity: 0.2;
        }
        
        .md-button:active { transform: scale(0.94); }
        
        .md-button-filled {
            background: linear-gradient(135deg, var(--md-sys-color-primary) 0%, var(--md-sys-color-tertiary) 100%);
            color: var(--md-sys-color-on-primary);
            box-shadow: 0 6px 20px rgba(208, 188, 255, 0.4);
        }
        
        .md-button-filled:active {
            box-shadow: 0 12px 32px rgba(208, 188, 255, 0.6);
        }
        
        .md-button-outlined {
            background: transparent;
            color: var(--md-sys-color-primary);
            border: 2px solid var(--md-sys-color-outline);
        }
        
        .md-button-outlined:active {
            background: rgba(208, 188, 255, 0.12);
            border-color: var(--md-sys-color-primary);
        }
        
        .icon {
            font-style: normal;
            font-size: 22px;
            transition: transform 0.3s var(--md-motion-spring);
        }
        
        .md-button:active .icon { transform: scale(1.2) rotate(10deg); }
        
        .debug-card {
            margin-top: 24px;
            background: var(--md-sys-color-surface-container);
            border-radius: 24px;
            padding: 24px;
            display: none;
            max-height: 500px;
            overflow-y: auto;
            animation: fadeInUp 0.5s var(--md-motion-emphasized);
            border: 1px solid var(--md-sys-color-outline-variant);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        
        .debug-card.show { display: block; }
        
        .debug-card pre {
            font-family: 'Roboto Mono', 'SF Mono', monospace;
            font-size: 10px;
            line-height: 1.6;
            color: var(--md-sys-color-on-surface-variant);
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        .error-banner {
            margin-top: 20px;
            padding: 18px 24px;
            background: var(--md-sys-color-error-container);
            border-radius: 20px;
            border-left: 5px solid var(--md-sys-color-error);
            font-size: 14px;
            color: var(--md-sys-color-on-error);
            display: none;
            align-items: center;
            gap: 14px;
            animation: slideInRight 0.5s var(--md-motion-emphasized);
        }
        
        .error-banner.show { display: flex; }
        
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--md-sys-color-outline-variant);
            border-radius: 5px;
            transition: background 0.3s;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--md-sys-color-outline); }
    </style>
</head>
<body>
    <div class="drain-leak-overlay" id="drain-leak-overlay"></div>
    
    <div class="container">
        <header class="app-header">
            <div class="header-left">
                <h1 class="app-title">devBattery Monitor</h1>
                <a href="https://t.me/hoshiyomi_id" class="app-subtitle">
                    <svg class="telegram-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 0 0-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
                    </svg>
                    <span>t.me/hoshiyomi_id</span>
                </a>
            </div>
            <div class="root-badge" id="root-badge" onclick="showDebug()">
                <span class="root-icon" id="root-icon">🔒</span>
                <span id="root-text">SEPolicy</span>
            </div>
        </header>
        
        <div class="tiles-grid">
            <div class="tile tile-large" id="tile-capacity">
                <div class="liquid-container" id="liquid-container">
                    <div class="liquid" id="liquid"></div>
                </div>
                
                <div class="tile-label">Battery</div>
                <div class="tile-value-wrapper">
                    <span class="tile-value" id="capacity-value">--</span>
                    <span class="tile-unit">%</span>
                </div>
                <div class="status-text" id="status-text">
                    <span id="status-label">--</span>
                </div>
            </div>
            
            <div class="tile" id="tile-current">
                <div class="tile-label">Current</div>
                <div class="tile-value-wrapper">
                    <span class="tile-value" id="current-value">--</span>
                    <span class="tile-unit">mA</span>
                </div>
            </div>
            
            <div class="tile" id="tile-power">
                <div class="tile-label">Power</div>
                <div class="tile-value-wrapper">
                    <span class="tile-value" id="power-value">--</span>
                    <span class="tile-unit">W</span>
                </div>
            </div>
            
            <div class="tile" id="tile-voltage">
                <div class="tile-label">Voltage</div>
                <div class="tile-value-wrapper">
                    <span class="tile-value" id="voltage-value">--</span>
                    <span class="tile-unit">V</span>
                </div>
            </div>
            
            <div class="tile" id="tile-temp">
                <div class="tile-label">Temperature</div>
                <div class="tile-value-wrapper">
                    <span class="tile-value" id="temp-value">--</span>
                    <span class="tile-unit">°C</span>
                </div>
            </div>
        </div>
        
        <div class="action-buttons">
            <button class="md-button md-button-filled" onclick="showDebug()">
                <span class="icon">🔍</span>
                <span>Show Debug Info</span>
            </button>
            <button class="md-button md-button-outlined" onclick="copyDebug()">
                <span class="icon">📋</span>
                <span>Copy to Clipboard</span>
            </button>
        </div>
        
        <div class="error-banner" id="error-banner">
            <span class="icon">⚠️</span>
            <span id="error-text"></span>
        </div>
        
        <div class="debug-card" id="debug-card">
            <pre id="debug-output"></pre>
        </div>
    </div>

    <script>
        let debugData = '';
        let hasRoot = false;
        let previousValues = {};
        let isCharging = false;
        let bubbleSpawnInterval = null;
        let bubbleCount = 0;
        let lastStatus = '';
        let currentCapacity = 0;
        let currentTheme = 'dark';
        let drainLeakTimeout = null;
        let activeDrainLeaks = 0;
        const MAX_DRAIN_LEAKS = 3;
        const MIN_INTERVAL = 5000;
        const MAX_INTERVAL = 10000;
        const DROPLET_DURATION = 1100;
        const SPLASH_TIMING = 1045;
        const LANDING_OFFSET = 15;
        
        function applyTheme(theme) {
            currentTheme = theme;
            const root = document.documentElement;
            
            if (theme === 'light') {
                root.style.setProperty('--md-sys-color-primary', '#6750A4');
                root.style.setProperty('--md-sys-color-surface', '#FFFBFE');
                root.style.setProperty('--md-sys-color-on-surface', '#1C1B1F');
                document.querySelector('meta[name="theme-color"]').setAttribute('content', '#FFFBFE');
            } else {
                root.style.setProperty('--md-sys-color-primary', '#D0BCFF');
                root.style.setProperty('--md-sys-color-surface', '#1C1B1F');
                root.style.setProperty('--md-sys-color-on-surface', '#E6E0E9');
                document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1C1B1F');
            }
        }
        
        try {
            if (typeof Android !== 'undefined' && Android.getSystemTheme) {
                applyTheme(Android.getSystemTheme());
            } else {
                applyTheme('dark');
            }
        } catch (e) {
            applyTheme('dark');
        }
        
        function formatPower(value) {
            const num = parseFloat(value);
            if (isNaN(num)) return value;
            return Math.min(99.9, num).toFixed(2).replace(/\.00$/, '');
        }
        
        function formatNumber(value, decimals = 1) {
            const num = parseFloat(value);
            if (isNaN(num)) return value;
            return Math.min(99.9, num).toFixed(decimals).replace(/\.0$/, '');
        }
        
        function calculateLandingPosition() {
            const tile = document.getElementById('tile-capacity');
            const rect = tile.getBoundingClientRect();
            const viewportHeight = window.innerHeight;
            const landingY = viewportHeight - LANDING_OFFSET;
            const spawnY = rect.bottom;
            const fallDistance = landingY - spawnY;
            
            return {
                spawnX: rect.right - 20,
                spawnY: spawnY,
                landingY: landingY,
                landingX: rect.right - 20,
                fallDistance: fallDistance
            };
        }
        
        function spawnRandomBubble() {
            if (!isCharging) return;
            
            const container = document.getElementById('liquid-container');
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            const size = 5 + Math.random() * 10;
            const left = 15 + Math.random() * 70;
            const drift = (Math.random() - 0.5) * 40;
            const duration = 2.5 + Math.random() * 1.5;
            const riseDistance = (currentCapacity * 2) - 14;
            
            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';
            bubble.style.left = left + '%';
            bubble.style.setProperty('--drift-x', drift + 'px');
            bubble.style.setProperty('--rise-distance', `-${riseDistance}px`);
            bubble.style.animationDuration = duration + 's';
            
            container.appendChild(bubble);
            bubbleCount++;
            
            setTimeout(() => {
                bubble.remove();
                bubbleCount--;
            }, duration * 1000);
        }
        
        function toggleBubbleSpawning(active) {
            if (active && !bubbleSpawnInterval) {
                bubbleSpawnInterval = setInterval(spawnRandomBubble, 400);
                isCharging = true;
            } else if (!active && bubbleSpawnInterval) {
                clearInterval(bubbleSpawnInterval);
                bubbleSpawnInterval = null;
                isCharging = false;
                document.querySelectorAll('.bubble').forEach(b => b.remove());
                bubbleCount = 0;
            }
        }
        
        function spawnSplash(landingY, landingX) {
            const splashColor = getBatteryColor(currentCapacity);
            const particleCount = 6 + Math.floor(Math.random() * 4);
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'splash-particle';
                particle.style.top = landingY + 'px';
                particle.style.left = landingX + 'px';
                
                const direction = (Math.random() - 0.5) * 2;
                const distance = (20 + Math.random() * 25) * Math.sign(direction || 1);
                
                particle.style.setProperty('--splash-x', distance + 'px');
                particle.style.setProperty('--splash-color', splashColor);
                particle.style.animationDelay = (Math.random() * 0.05) + 's';
                
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 500);
            }
        }
        
        function spawnDrainDrip() {
            if (activeDrainLeaks >= MAX_DRAIN_LEAKS) return;
            
            const overlay = document.getElementById('drain-leak-overlay');
            const drip = document.createElement('div');
            drip.className = 'drain-drip';
            
            const pos = calculateLandingPosition();
            drip.style.top = pos.spawnY + 'px';
            drip.style.left = pos.spawnX + 'px';
            drip.style.setProperty('--fall-distance', pos.fallDistance + 'px');
            drip.style.setProperty('--drain-color', getBatteryColor(currentCapacity));
            
            overlay.appendChild(drip);
            activeDrainLeaks++;
            
            setTimeout(() => spawnSplash(pos.landingY, pos.landingX), SPLASH_TIMING);
            setTimeout(() => {
                drip.remove();
                activeDrainLeaks--;
            }, DROPLET_DURATION);
        }
        
        function scheduleNextDrip() {
            if (!drainLeakTimeout) return;
            
            const nextInterval = Math.floor(Math.random() * (MAX_INTERVAL - MIN_INTERVAL + 1)) + MIN_INTERVAL;
            drainLeakTimeout = setTimeout(() => {
                spawnDrainDrip();
                scheduleNextDrip();
            }, nextInterval);
        }
        
        function toggleDrainLeak(active) {
            if (active && !drainLeakTimeout) {
                drainLeakTimeout = true;
                setTimeout(() => {
                    if (!drainLeakTimeout) return;
                    spawnDrainDrip();
                    scheduleNextDrip();
                }, 3000);
            } else if (!active && drainLeakTimeout) {
                clearTimeout(drainLeakTimeout);
                drainLeakTimeout = null;
                document.querySelectorAll('.drain-drip, .splash-particle').forEach(el => el.remove());
                activeDrainLeaks = 0;
            }
        }
        
        function getBatteryColor(percentage) {
            let r, g, b;
            if (percentage < 50) {
                const ratio = percentage / 50;
                r = 244;
                g = Math.floor(67 + (244 - 67) * ratio);
                b = 54;
            } else {
                const ratio = (percentage - 50) / 50;
                r = Math.floor(244 - (244 - 76) * ratio);
                g = Math.floor(244 - (244 - 175) * ratio);
                b = Math.floor(54 + (80 - 54) * ratio);
            }
            return `rgba(${r}, ${g}, ${b}, 0.9)`;
        }
        
        function updateLiquid(percentage) {
            const liquid = document.getElementById('liquid');
            currentCapacity = percentage;
            liquid.style.height = percentage + '%';
            
            const color = getBatteryColor(percentage);
            liquid.style.background = `linear-gradient(180deg, 
                ${getBatteryColor(Math.min(100, percentage + 12))} 0%, 
                ${getBatteryColor(Math.min(100, percentage + 6))} 50%, 
                ${color} 100%)`;
        }
        
        function animateValue(elementId, newValue) {
            const element = document.getElementById(elementId);
            if (previousValues[elementId] !== newValue) {
                element.classList.add('updating');
                setTimeout(() => element.classList.remove('updating'), 400);
            }
            element.textContent = newValue;
            previousValues[elementId] = newValue;
        }
        
        function updateBattery() {
            try {
                const data = JSON.parse(Android.getBatteryData());
                if (data.error) {
                    showError('Error: ' + data.error);
                    return;
                }
                
                const capacity = parseInt(data.capacity) || 0;
                const status = data.status || lastStatus || "Unknown";
                const voltage = formatNumber((parseInt(data.voltage) || 0) / 1000, 2);
                const current = Math.floor((parseInt(data.current_now) || 0) / 1000);
                const temperature = formatNumber((parseInt(data.temp) || 0) / 10, 1);
                const power = formatPower(Math.abs(((parseInt(data.voltage) || 0) * (parseInt(data.current_now) || 0)) / 1000000000));
                
                if (status !== "Unknown") lastStatus = status;
                
                animateValue('capacity-value', capacity);
                document.getElementById('status-label').textContent = lastStatus;
                animateValue('voltage-value', voltage);
                animateValue('current-value', current);
                animateValue('power-value', power);
                animateValue('temp-value', temperature);
                
                updateLiquid(capacity);
                
                const chargingActive = lastStatus.toLowerCase() === 'charging';
                toggleBubbleSpawning(chargingActive);
                
                const isDraining = lastStatus.toLowerCase() === 'discharging' || lastStatus.toLowerCase() === 'not charging';
                toggleDrainLeak(isDraining);
                
                if (capacity > 0) hideError();
            } catch (e) {
                showError('Error: ' + e.message);
            }
        }
        
        function showError(message) {
            const banner = document.getElementById('error-banner');
            document.getElementById('error-text').textContent = message;
            banner.classList.add('show');
        }
        
        function hideError() {
            document.getElementById('error-banner').classList.remove('show');
        }
        
        function showDebug() {
            try {
                debugData = Android.getDebugInfo();
                document.getElementById('debug-output').textContent = debugData;
                document.getElementById('debug-card').classList.add('show');
            } catch (e) {
                showError('Debug unavailable');
            }
        }
        
        function copyDebug() {
            if (!debugData) showDebug();
            
            const textarea = document.createElement('textarea');
            textarea.value = debugData;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showError('✅ Copied!');
                setTimeout(hideError, 2500);
            } catch (e) {
                showError('❌ Failed to copy');
            }
            
            document.body.removeChild(textarea);
        }
        
        setTimeout(() => {
            updateBattery();
        }, 300);
        
        setInterval(updateBattery, 1000);
    </script>
</body>
</html>
