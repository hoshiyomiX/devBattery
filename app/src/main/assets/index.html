<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="theme-color" content="#1C1B1F">
    <title>devBattery Monitor</title>
    <style>
        /* STYLES REMAIN EXACTLY THE SAME - TOO LONG TO INCLUDE HERE */
        /* Copy all CSS from original file */
    </style>
</head>
<body>
    <!-- Global Drain Leak Overlay -->
    <div class="drain-leak-overlay" id="drain-leak-overlay"></div>
    
    <!-- ROOT MODAL COMPLETELY REMOVED -->
    
    <div class="container">
        <header class="app-header">
            <div class="header-left">
                <h1 class="app-title">devBattery Monitor</h1>
                <a href="https://t.me/hoshiyomi_id" class="app-subtitle">
                    <img src="icons/telegram.svg" class="telegram-icon" alt="Telegram">
                    <span>t.me/hoshiyomi_id</span>
                </a>
            </div>
            <!-- Badge shows SEPolicy status, not clickable -->
            <div class="root-badge non-rooted" id="root-badge">
                <span class="root-icon">✓</span>
                <span id="root-text">SEPolicy</span>
            </div>
        </header>
        
        <!-- Rest of UI stays the same -->
    </div>

    <script>
        let debugData = '';
        let previousValues = {};
        let isCharging = false;
        let bubbleSpawnInterval = null;
        let lastStatus = '';
        let currentCapacity = 0;
        let currentTheme = 'dark';
        
        // All animation/timing constants stay the same
        let drainLeakTimeout = null;
        let activeDrainLeaks = 0;
        const MAX_DRAIN_LEAKS = 3;
        const MIN_INTERVAL = 5000;
        const MAX_INTERVAL = 10000;
        const STARTUP_DELAY = 3000;
        const DROPLET_DURATION = 1100;
        const SPLASH_TIMING = 1045;
        const LANDING_OFFSET = 15;
        
        const debugLog = {
            updates: 0,
            lastUpdate: Date.now(),
            batteryHistory: [],
            statusChanges: [],
            bubbleStats: { total: 0, active: 0 },
            drainStats: { total: 0, active: 0, intervals: [], splashes: 0 },
            performance: { avgUpdateTime: 0, totalTime: 0 },
            errors: [],
            voltageSource: [],
            themeChanges: []
        };
        
        // Theme functions stay the same
        function applyTheme(theme) {
            // ... existing theme code ...
        }
        
        // Initialize theme from Android
        try {
            if (typeof Android !== 'undefined' && typeof Android.getSystemTheme === 'function') {
                const systemTheme = Android.getSystemTheme();
                applyTheme(systemTheme);
            } else {
                applyTheme('dark');
            }
        } catch (e) {
            applyTheme('dark');
        }
        
        // ALL ROOT-RELATED FUNCTIONS REMOVED:
        // - showRootModal()
        // - dismissRootModal()
        // - requestRootFromModal()
        // - retryRootAccess()
        // - checkRootStatus()
        // - updateRootBadge()
        
        // All animation functions stay the same
        // (getBatteryColor, spawnRandomBubble, toggleBubbleSpawning, etc.)
        
        function updateBattery() {
            const startTime = performance.now();
            
            try {
                const jsonData = Android.getBatteryData();
                const data = JSON.parse(jsonData);
                
                if (data.error) {
                    showError('Error: ' + data.error);
                    return;
                }
                
                // Parse battery data
                const capacity = parseInt(data.capacity) || 0;
                const status = data.status || lastStatus || "Unknown";
                const voltageRaw = parseInt(data.voltage) || 0;
                const currentRaw = parseInt(data.current_now) || 0;
                const tempRaw = parseInt(data.temp) || 0;
                
                if (status !== "Unknown") {
                    lastStatus = status;
                }
                
                // Format values
                const voltage = formatNumber(voltageRaw / 1000, 2);
                const current = Math.floor(currentRaw / 1000);
                const temperature = formatNumber(tempRaw / 10, 1);
                
                // Calculate power (always use battery voltage × current)
                const power = formatPower(Math.abs((voltageRaw * currentRaw) / 1000000000));
                
                // Update UI
                animateValue('capacity-value', capacity);
                document.getElementById('status-label').textContent = lastStatus;
                
                const statusLower = lastStatus.toLowerCase();
                const chargingActive = (statusLower === 'charging');
                
                // Toggle animations
                toggleBubbleSpawning(chargingActive);
                const isDraining = (statusLower === 'discharging' || statusLower === 'not charging');
                toggleDrainLeak(isDraining);
                
                updateLiquid(capacity);
                animateValue('voltage-value', voltage);
                animateValue('current-value', current);
                animateValue('power-value', power);
                animateValue('temp-value', temperature);
                
                if (capacity > 0 && lastStatus !== 'Unknown') {
                    hideError();
                }
                
                const updateTime = performance.now() - startTime;
                debugLog.updates++;
                debugLog.performance.totalTime += updateTime;
                debugLog.performance.avgUpdateTime = debugLog.performance.totalTime / debugLog.updates;
                debugLog.lastUpdate = Date.now();
                
            } catch (e) {
                debugLog.errors.push({ time: new Date().toISOString(), error: e.message });
                showError('Error: ' + e.message);
            }
        }
        
        function showDebug() {
            try {
                debugData = '========== DEVBATTERY DEBUG (NO ROOT) ==========\n\n';
                debugData += '--- BUILD INFO ---\n';
                debugData += 'Version: RENUKED v3.0 - NO ROOT\n';
                debugData += 'Mode: SEPolicy Modified (no root required)\n\n';
                
                debugData += '--- SYSTEM INFO ---\n';
                debugData += `Current Theme: ${currentTheme}\n`;
                debugData += `Current Capacity: ${currentCapacity}%\n`;
                debugData += `Viewport: ${window.innerWidth}x${window.innerHeight}\n\n`;
                
                debugData += '--- PERFORMANCE ---\n';
                debugData += `Updates: ${debugLog.updates}\n`;
                debugData += `Avg Time: ${debugLog.performance.avgUpdateTime.toFixed(2)}ms\n\n`;
                
                debugData += '--- RAW ANDROID DATA ---\n';
                debugData += Android.getDebugInfo();
                
                document.getElementById('debug-output').textContent = debugData;
                document.getElementById('debug-card').classList.add('show');
            } catch (e) {
                showError('Error: ' + e.message);
            }
        }
        
        function copyDebug() {
            if (!debugData) showDebug();
            
            const textarea = document.createElement('textarea');
            textarea.value = debugData;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showError('✅ Copied!');
                setTimeout(hideError, 2500);
            } catch (e) {
                showError('❌ Failed to copy');
            }
            
            document.body.removeChild(textarea);
        }
        
        // Start monitoring - NO ROOT CHECK!
        setTimeout(() => {
            console.log('[INIT] 🚀 Battery monitoring (no root)');
            updateBattery(); // Direct update, no root check
        }, 300);
        
        // Only battery updates, NO root checks
        setInterval(updateBattery, 1000);
    </script>
</body>
</html>
