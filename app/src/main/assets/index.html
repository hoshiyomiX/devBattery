<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="theme-color" content="#1C1B1F">
    <title>devBattery Monitor</title>
    
    <!-- Modular CSS -->
    <link rel="stylesheet" href="css/core.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <!-- Global Drain Leak Overlay -->
    <div class="drain-leak-overlay" id="drain-leak-overlay"></div>
    
    <div class="container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <h1 class="app-title">devBattery Monitor</h1>
                <a href="https://t.me/hoshiyomi_id" class="app-subtitle">
                    <svg class="telegram-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 0 0-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
                    </svg>
                    <span>t.me/hoshiyomi_id</span>
                </a>
            </div>
            
            <!-- SEPolicy Badge -->
            <div class="root-badge non-rooted" id="root-badge">
                <span class="root-icon">✓</span>
                <span id="root-text">SEPolicy</span>
            </div>
        </header>
        
        <!-- Battery Visual (WebGL + Fallback) -->
        <div class="battery-visual">
            <div class="liquid-container">
                <!-- WebGL Canvas (Primary) -->
                <canvas id="fluid-canvas"></canvas>
                
                <!-- CSS Fallback (if WebGL fails) -->
                <div class="liquid-fallback" style="height: 50%"></div>
                
                <!-- Charging Bubbles (legacy, optional) -->
                <div class="bubbles" id="bubbles"></div>
            </div>
            
            <!-- Capacity & Status Overlay -->
            <div class="center-info">
                <div class="capacity-text"><span id="capacity-value">--</span>%</div>
                <div class="status-text" id="status-label">Loading...</div>
            </div>
        </div>
        
        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Voltage</span>
                <div class="stat-value">
                    <span id="voltage-value">--</span>
                    <span class="unit">V</span>
                </div>
            </div>
            
            <div class="stat-card">
                <span class="stat-label">Current</span>
                <div class="stat-value">
                    <span id="current-value">--</span>
                    <span class="unit">mA</span>
                </div>
            </div>
            
            <div class="stat-card">
                <span class="stat-label">Power</span>
                <div class="stat-value">
                    <span id="power-value">--</span>
                    <span class="unit">W</span>
                </div>
            </div>
            
            <div class="stat-card">
                <span class="stat-label">Temperature</span>
                <div class="stat-value">
                    <span id="temp-value">--</span>
                    <span class="unit">°C</span>
                </div>
            </div>
        </div>
        
        <!-- Safe Area Bottom -->
        <div class="safe-area-bottom"></div>
    </div>

    <!-- Error Toast -->
    <div class="error-toast" id="error-toast">Connection Error</div>
    
    <!-- Debug Panel -->
    <div class="debug-card" id="debug-card">
        <div class="debug-header">
            <span class="debug-title">Debug Log</span>
            <button class="close-btn" onclick="hideDebug()">×</button>
        </div>
        <div class="debug-content" id="debug-output">Loading debug info...</div>
        <div class="debug-actions">
            <button class="action-btn btn-copy" onclick="copyDebug()">Copy Log</button>
        </div>
    </div>

    <!-- Modular JavaScript (order matters) -->
    <script src="js/fluid-sim.js"></script>
    <script src="js/battery.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
